<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cryptocube: шесть кубиков</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: wooden cube (map of faces) · simulated phone (the sandbox) · task card (what to do and why) */
:root {
  --bg: #e6ecea;          /* teal-grey velvet the cube sits on */
  --surface: #fbfcfb;
  --surface-2: #f1f4f2;
  --line: #cdd6d3;
  --wood: #dcbf98;        /* beech */
  --wood-edge: #c9a676;
  --burn: #2b1e14;        /* laser-burnt engraving */
  --fg: #1d2523;
  --muted: #5b6764;
  --accent: #1f6a64;
  --accent-soft: #d5e8e5;
  --on-accent: #ffffff;
  --ok: #2c7a47;
  --ok-soft: #dcefe2;
  --bad: #b0412c;
  --bad-soft: #f6e0da;
  --warn: #9a6a12;
  --phone: #141a19;
  --screen: #ffffff;
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Onest", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141c1c; --surface: #1c2626; --surface-2: #222e2e; --line: #33413f;
  --wood: #b8946a; --wood-edge: #9c7a52; --burn: #2a1b10;
  --fg: #e8eeec; --muted: #9aa8a5; --accent: #5fb5ac; --accent-soft: #1f3836; --on-accent: #0e1a19;
  --ok: #6cc28b; --ok-soft: #1d3527; --bad: #e88a73; --bad-soft: #3a221c; --warn: #e0b45a;
  --phone: #050707; --screen: #1a2222; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141c1c; --surface: #1c2626; --surface-2: #222e2e; --line: #33413f;
  --wood: #b8946a; --wood-edge: #9c7a52; --burn: #2a1b10;
  --fg: #e8eeec; --muted: #9aa8a5; --accent: #5fb5ac; --accent-soft: #1f3836; --on-accent: #0e1a19;
  --ok: #6cc28b; --ok-soft: #1d3527; --bad: #e88a73; --bad-soft: #3a221c; --warn: #e0b45a;
  --phone: #050707; --screen: #1a2222; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: 0.86em; word-break: break-all; }
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 20px; }

header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font: 700 22px/1.2 var(--font-display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.brand .sub { color: var(--muted); }
.meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-variant-numeric: tabular-nums; }
.pill.sandbox { border-color: var(--warn); color: var(--warn); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11px; }
.switch { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); flex-wrap: wrap; }
.tabbtn { border: 0; background: transparent; border-radius: 8px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.tabbtn.on { background: var(--fg); color: var(--bg); font-weight: 600; }
.tabbtn:disabled { opacity: 0.5; cursor: not-allowed; }
.ghost { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 6px 12px; font-size: 13px; }

.layout { display: grid; gap: 20px; grid-template-columns: 260px minmax(0, 380px) minmax(0, 1fr); align-items: start; }
@media (max-width: 1100px) { .layout { grid-template-columns: 240px minmax(0, 1fr); } .brief { grid-column: 1 / -1; } }
@media (max-width: 720px) { .layout { grid-template-columns: minmax(0, 1fr); } .cubecol { order: 0; } .brief { order: 1; } .phonecol { order: 2; } }

/* cube */
.cubecol { display: grid; gap: 16px; }
.scene { height: 210px; perspective: 700px; display: grid; place-items: center; }
.cube { width: 140px; height: 140px; position: relative; transform-style: preserve-3d; transition: transform 0.9s cubic-bezier(.2,.7,.2,1); }
@media (prefers-reduced-motion: reduce) { .cube { transition: none; } }
.face { position: absolute; inset: 0; background: var(--wood); border: 1px solid var(--wood-edge); border-radius: 6px;
  display: grid; place-items: center; align-content: center; gap: 6px; color: var(--burn); backface-visibility: hidden;
  background-image: repeating-linear-gradient(100deg, transparent 0 7px, rgba(90,60,30,0.07) 7px 8px); }
.face .n { width: 30px; height: 30px; border: 2px solid var(--burn); border-radius: 50%; display: grid; place-items: center; font: 700 15px var(--font-display); }
.face .t { font: 600 13px var(--font-body); text-align: center; padding: 0 8px; }
.face.lit { box-shadow: inset 0 0 0 3px var(--burn); }
.face.lit .n { background: var(--burn); color: var(--wood); }
.f1 { transform: translateZ(70px); } .f2 { transform: rotateY(90deg) translateZ(70px); } .f3 { transform: rotateY(180deg) translateZ(70px); }
.f4 { transform: rotateY(-90deg) translateZ(70px); } .f5 { transform: rotateX(90deg) translateZ(70px); } .f6 { transform: rotateX(-90deg) translateZ(70px); }
.facelist { display: grid; gap: 6px; list-style: none; margin: 0; padding: 0; }
.facelist button { width: 100%; text-align: left; display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; border: 1px solid transparent; background: transparent; }
.facelist button:hover:not(:disabled) { background: var(--surface); }
.facelist button.cur { background: var(--surface); border-color: var(--line); }
.facelist button:disabled { opacity: 0.45; cursor: not-allowed; }
.facelist .num { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--fg); display: grid; place-items: center; font: 600 12px var(--font-display); }
.facelist .done .num { background: var(--fg); color: var(--bg); }
.facelist .st { font-size: 12px; color: var(--muted); }

/* phone */
.phonecol { display: grid; justify-items: center; }
.phone { width: 100%; max-width: 360px; background: var(--phone); border-radius: 36px; padding: 12px; box-shadow: 0 18px 40px rgba(0,0,0,0.18); }
.screen { background: var(--screen); border-radius: 26px; height: 640px; position: relative; overflow: hidden; display: flex; flex-direction: column; }
.statusbar { display: flex; justify-content: space-between; padding: 10px 18px 4px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.appbar { padding: 6px 16px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.appbar h2 { font: 600 17px var(--font-body); margin: 0; }
.body { flex: 1; overflow-y: auto; padding: 4px 16px 16px; display: grid; align-content: start; grid-auto-rows: max-content; gap: 12px; min-height: 0; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); }
.tabs button { background: none; border: 0; padding: 10px 4px 14px; font-size: 12px; color: var(--muted); position: relative; }
.tabs button.on { color: var(--accent); font-weight: 600; }
.tabs .dot { position: absolute; top: 6px; right: 28%; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
.watermark { position: absolute; inset: auto 0 64px; text-align: center; font: 700 11px var(--font-display); letter-spacing: 0.3em; color: var(--warn); opacity: 0.55; pointer-events: none; }

.btn { border: 0; border-radius: 12px; padding: 12px 14px; background: var(--accent); color: var(--on-accent); font-weight: 600; width: 100%; }
.btn.sec { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }
.btn.danger { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.row { display: flex; gap: 8px; } .row > * { flex: 1; min-width: 0; }
.card { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--surface); display: grid; gap: 6px; }
.muted { color: var(--muted); font-size: 13px; }
.big { font: 700 26px var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.asset { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.asset:last-child { border-bottom: 0; }
.coin { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 700 11px var(--font-display); background: var(--accent-soft); color: var(--accent); }
.coin.cube { background: var(--wood); color: var(--burn); }
.num { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); text-align: left; width: 100%; }
.app .icon { width: 48px; height: 48px; border-radius: 12px; background: var(--wood); display: grid; place-items: center; color: var(--burn); font: 700 18px var(--font-display); }
.ad { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; padding: 0 4px; }

.pinrow { display: flex; justify-content: center; gap: 12px; padding: 8px 0; }
.pinrow span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--fg); }
.pinrow span.f { background: var(--fg); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keypad button { padding: 14px 0; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font: 600 18px var(--font-body); }

.seedgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; counter-reset: w; padding: 12px; border: 1px dashed var(--warn); border-radius: 12px; }
.seedgrid div { font-family: var(--font-mono); font-size: 14px; }
.seedgrid div::before { counter-increment: w; content: counter(w) ". "; color: var(--muted); display: inline-block; width: 2.2em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-family: var(--font-mono); font-size: 13px; }
.chip.sel { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.choice { text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); width: 100%; }

.qr { display: grid; grid-template-columns: repeat(21, 1fr); width: 168px; aspect-ratio: 1; max-width: 100%; margin: 0 auto; padding: 8px; background: #fff; border-radius: 8px; }
.qr i { background: #fff; } .qr i.b { background: #111; }

.msg { max-width: 86%; padding: 8px 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
.msg.me { justify-self: end; background: var(--accent-soft); border-color: transparent; }
.msg .who { font-size: 11px; font-weight: 600; color: var(--muted); }
.msg.scam .who { color: var(--muted); }

.tx { display: grid; gap: 2px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-align: left; width: 100%; }
.status { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
.status.pending { color: var(--warn); } .status.ok { color: var(--ok); }
dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 13px; }
dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; min-width: 0; }

.block { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 4px; background: var(--surface); }
.block.broken { border-color: var(--bad); background: var(--bad-soft); }
.block input { font: inherit; width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--screen); color: var(--fg); }
.link { text-align: center; color: var(--muted); font-size: 18px; line-height: 1; }
.link.broken { color: var(--bad); }

.field { display: grid; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); }
.field input, .restore input { font: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--screen); color: var(--fg); width: 100%; }
.restore { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.restore input { font-family: var(--font-mono); font-size: 13px; padding: 8px; }
.fees { display: grid; gap: 6px; }
.fee { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--surface); }
.fee.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

.trap { position: absolute; inset: 0; background: rgba(10,12,12,0.55); display: grid; align-items: end; padding: 12px; z-index: 5; }
.trap .sheet { background: var(--screen); border-radius: 20px; padding: 16px; display: grid; gap: 10px; border-top: 4px solid var(--bad); }
.trap .tag { font: 700 11px var(--font-display); letter-spacing: 0.12em; color: var(--bad); text-transform: uppercase; }
.trap h3 { margin: 0; font-size: 17px; }

/* brief */
.brief { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
.eyebrow { font: 600 11px var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
.brief h2 { font: 700 20px/1.25 var(--font-display); margin: 4px 0 0; text-wrap: balance; }
.brief p { margin: 0; max-width: 62ch; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.steps li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; }
.steps .box { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--muted); margin-top: 2px; display: grid; place-items: center; font-size: 13px; }
.steps li.ok .box { background: var(--ok); border-color: var(--ok); color: #fff; }
.steps li.ok span:last-child { color: var(--muted); }
.explain { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.explain b { font-weight: 600; }
.quiz { display: grid; gap: 14px; }
.quiz fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 6px; }
.quiz legend { font-weight: 600; margin-bottom: 4px; }
.quiz .opt { text-align: left; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--surface-2); }
.quiz .opt.right { border-color: var(--ok); background: var(--ok-soft); }
.quiz .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.site { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.site .bar { background: var(--surface-2); padding: 6px 10px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
.site .in { padding: 12px; display: grid; gap: 6px; }
.paper { background: #fffdf6; color: #2a2a2a; border-radius: 4px; padding: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); transform: rotate(-0.6deg); }
.paper .seedgrid { border: 0; padding: 0; }
.paper .seedgrid div::before { color: #888; }
.done-banner { border: 2px solid var(--ok); border-radius: 14px; padding: 14px; display: grid; gap: 8px; background: var(--ok-soft); }
.final { display: grid; gap: 10px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stats div { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--surface-2); }
.stats b { display: block; font: 700 20px var(--font-display); font-variant-numeric: tabular-nums; }
.feed { display: grid; gap: 6px; font-size: 13px; }
.feed div { display: grid; grid-template-columns: auto 1fr; gap: 8px; color: var(--muted); }

/* справочник, подсказки, ИИ-помощник */
[hidden] { display: none !important; }
.term { border-bottom: 1.5px dotted var(--accent); cursor: help; }
.term:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 2px; }
#tip { position: fixed; z-index: 60; background: var(--fg); color: var(--bg); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; font-size: 13px; line-height: 1.45; box-shadow: 0 8px 24px rgba(0,0,0,0.2); pointer-events: none; }
#tip .tipmeta { opacity: 0.7; font-size: 11px; }
#helppanel { position: fixed; inset: 0; z-index: 40; background: rgba(10,12,12,0.45); display: flex; justify-content: flex-end; }
.hp-sheet { background: var(--surface); width: min(560px, 100%); height: 100%; display: flex; flex-direction: column; box-shadow: -8px 0 30px rgba(0,0,0,0.2); }
.hp-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 16px; border-bottom: 1px solid var(--line); }
.hp-body { overflow-y: auto; padding: 16px; display: grid; gap: 18px; align-content: start; }
.gsec { display: grid; gap: 8px; }
dl.gloss { margin: 0; display: grid; gap: 2px 0; }
dl.gloss dt { font-weight: 600; margin-top: 8px; }
dl.gloss dd { margin: 0; color: var(--muted); }
ul.lib { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
ul.lib li { display: grid; gap: 1px; }
ul.lib a { color: var(--accent); font-weight: 600; }
#aibtn { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 16px; z-index: 30; border: 0; border-radius: 999px; padding: 12px 18px; background: var(--accent); color: var(--on-accent); font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
#aibox { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 16px; z-index: 35; width: min(380px, calc(100vw - 32px)); height: min(560px, calc(100dvh - 32px)); background: var(--screen); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 12px 40px rgba(0,0,0,0.25); display: flex; flex-direction: column; overflow: hidden; }
.ai-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.ai-head .muted { font-size: 12px; }
.ai-log { flex: 1; overflow-y: auto; padding: 12px; display: grid; gap: 8px; align-content: start; min-height: 0; }
.ai-form { display: flex; gap: 6px; padding: 10px 12px 4px; border-top: 1px solid var(--line); }
.ai-form input { flex: 1; min-width: 0; font: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--surface); color: var(--fg); }
.ai-form .btn { width: auto; }
.ai-note { margin: 0; padding: 0 12px 10px; font-size: 11px; color: var(--muted); }
body { padding-bottom: 80px; }

/* ---- mobile: phone-first layout ---- */
.switch { max-width: 100%; overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; }
.switch::-webkit-scrollbar { display: none; }
.switch .tabbtn { flex: 0 0 auto; }
#langbtn { min-width: 44px; }
@media (max-width: 720px) {
  body { padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }
  #aibtn { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  body { font-size: 15px; }
  .wrap { gap: 14px; }
  header.top { flex-direction: column; align-items: stretch; gap: 10px; }
  .brand h1 { font-size: 19px; }
  .brand .sub { display: none; }
  .meta { flex-wrap: wrap; gap: 6px; }
  .meta .ghost { min-height: 40px; padding: 8px 12px; }
  .scene { height: 170px; zoom: 0.8; }
  .facelist { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(124px, 1fr); overflow-x: auto; gap: 6px; padding-bottom: 4px; scrollbar-width: thin; }
  .facelist button { grid-template-columns: 26px 1fr; padding: 8px; }
  .facelist .st { display: none; }
  .phone { max-width: 100%; border-radius: 30px; padding: 10px; }
  .screen { height: min(640px, 82vh); min-height: 520px; border-radius: 22px; }
  .brief { padding: 16px; }
  .brief h2 { font-size: 18px; }
  .stats { grid-template-columns: 1fr 1fr 1fr; }
  .row { flex-wrap: wrap; }
  .row > * { flex: 1 1 100%; }
  .qr { width: 150px; }
}
@media (max-width: 380px) {
  .meta .pill { font-size: 12px; }
}
body { overflow-x: hidden; }

/* Телефон: нижние вкладки, плашка шага, компактная шапка */
#mtabs, #mstep { display: none; }
@media (max-width: 720px) {
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  #aibtn { display: none; }
  #mtabs { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--line); padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  #mtabs button { position: relative; min-height: 58px; border: 0; background: none; color: var(--muted); font: 500 13px var(--font-body, inherit); display: grid; place-items: center; gap: 2px; padding: 6px 2px; cursor: pointer; }
  #mtabs button .ic { font-size: 18px; line-height: 1; }

ит, а сайт, где его «покупают», крадёт деньги.": "The name and ticker match, but the contract address doesn't (“l9” at the end instead of “19”). A token like that is worthless, and the site where people “buy” it steals money.", "Введите сумму больше нуля": "Enter an amount greater than zero", "Не хватает ETH на сумму и комиссию": "Not enough ETH for the amount and the fee", "Комиссия дороже половины перевода": "The fee is more than half the transfer", "Вы отдали ": "You paid ", " ETH валидаторам за перевод ": " ETH to validators for a transfer of ", " ETH. Перевод другу не горит: «Обычно» дошло бы за полминуты за ": " ETH. A transfer to a friend isn't urgent: “Normal” would have arrived in half a minute for ", " ETH. Отмотаем время, попробуйте ещё раз.": " ETH. Let's rewind time, try again.", "Поддержка Cube Wallet": "Cube Wallet Support", "Здравствуйте! После восстановления ваш кошелёк помечен как подозрительный. Пройдите верификацию: отправьте 12 слов в этот чат в течение 30 минут.": "Hello! After the restore your wallet was flagged as suspicious. Please verify: send your 12 words to this chat within 30 minutes.", "Счёт за заказ: 0,02 ETH. Адрес: ": "Invoice for the order: 0.02 ETH. Address: ", "Это мошенник": "This is a scammer", "Настоящая поддержка не пишет первой и никогда не просит seed-фразу. Аккаунт ": "Real support never messages first and never asks for a seed phrase. The account ", " создан вчера. Пожалуйтесь на него и не отвечайте.": " was created yesterday. Report it and don't reply.", "Заблокировать и пожаловаться": "Block and report", "Привет! Хочу скинуть тебе 0,1 ETH на первый кошелёк. Пришли адрес.": "Hi! I want to send you 0.1 ETH for your first wallet. Send me your address.", "Вернёшь 0,05 ETH, когда сможешь? Не срочно.": "Can you pay back 0.05 ETH when you can? No rush.", "пройдена": "done", "сейчас": "now", "открыта": "open", "закрыта": "locked", "Песочница · Ethereum": "Sandbox · Ethereum", "Сообщения": "Messages", "Обозреватель": "Explorer", tten copy.</p>", "Слово №": "Word #", "Подтвердить": "Confirm", "Где хранить запись?": "Where will you keep the copy?", "Бумага в надёжном месте дома": "Paper in a safe place at home", "Можно сделать вторую копию в другом месте": "You can make a second copy somewhere else", "Металлическая пластина": "Metal plate", "Не боится воды и огня": "Survives water and fire", "Заметки в телефоне": "Phone notes", "Всегда под рукой": "Always at hand", "Фото записи в галерее": "Photo of the copy in the gallery", "Не потеряется": "Won't get lost", "Seed-фраза сохранена": "Seed phrase saved", "Кошелёк готов к первому переводу. Переходите к грани 4.": "The wallet is ready for its first transfer. Go to face 4.", "Телефон упал в реку.": "The phone fell into the river.", "Новый телефон уже распакован. Кошелька на нём нет.": "The new phone is already unboxed. There's no wallet on it.", "Включить новый телефон": "Turn on the new phone", "<p style=\"color:var(--bad)\">Фраза не подходит. Проверьте порядок и написание слов.</p>": "<p style=\"color:var(--bad)\">The phrase doesn't fit. Check the order and spelling of the words.</p>", "<p class=\"muted\">Введите 12 слов из своей записи.</p>": "<p class=\"muted\">Enter the 12 words from your written copy.</p>", "Восстановить существующий кошелёк": "Restore an existing wallet", "Восстановить": "Restore", "Отправить 12 слов": "Send the 12 words", "Отказать": "Refuse", "Пройти верификацию": "Verify", "Заблокировать": "Block", "Оплатить счёт": "Pay the invoice", "<p class=\"muted\">Сообщений пока нет.</p>": "<p class=\"muted\">No messages yet.</p>", "Транзакция": "Transaction", "<button class=\"ghost\" data-act=\"view\" data-arg=\"\">Назад</button>": "<button class=\"ghost\" data-act=\"view\" data-arg=\"\">Back</button>", "Подтверждена": "Confirmed", "В очереди": "Pending", "Хэш": "Hash", "От": "From", "Кому": "To", "Сумма": "Amount", "Комиссия": "Fee", "Эти данные видит любой человек в мире. Блокчейн публичен.": "Anyone in the world can see this data. The blockchain is public.", "Блок ": "Block ", "от ": "from ", "кому ": "to ", "<p class=\"muted\">Пока пусто.</p>": "<p class=\"muted\">Nothing here yet.</p>", "Последние транзакции с вашим адресом": "Recent transactions with your address", "Получить": "Receive", "<button class=\"btn\" data-act=\"sendaddr\">Отправить адрес Маше</button>": "<button class=\"btn\" data-act=\"sendaddr\">Send your address to Masha</button>", "Учебный QR-код адреса": "Training QR code of the address", "Ваш адрес в сети Ethereum": "Your address on the Ethereum network", "Скопировать": "Copy", "Добавить токен": "Add token", "Сверьте адрес контракта с официальным сайтом (справа или ниже).": "Check the contract address against the official site (on the right or below).", "Проверьте перевод": "Review the transfer", "<button class=\"ghost\" data-act=\"sendform\">Назад</button>": "<button class=\"ghost\" data-act=\"sendform\">Back</button>", "Итого": "Total", "Перевод в блокчейне нельзя отменить.": "A blockchain transfer can't be reversed.", "Подтвердить и отправить": "Confirm and send", "Отправить": "Send", "<span style=\"color:var(--warn)\">· сейчас час пик</span>": "<span style=\"color:var(--warn)\">· it's peak hour now</span>", "Сумма, ETH (доступно": "Amount, ETH (available", "Комиссия сети": "Network fee", "Далее": "Next", "disabled title=\"Откроется на грани 5\"": "disabled title=\"Opens on face 5\"", "<button class=\"btn sec\" data-act=\"tokensearch\">Добавить токен</button>": "<button class=\"btn sec\" data-act=\"tokensearch\">Add token</button>", "<p class=\"muted\">Балансы на месте: они хранятся в сети, а не в телефоне.</p>": "<p class=\"muted\">The balances are still there: they live in the network, not in the phone.</p>", "Баланс": "Balance", "Контракт CUBE": "CUBE contract", "Отмотать время и повторить": "Rewind time and retry", "Понятно, попробую иначе": "Got it, I'll try another way", "Учебная атака · ловушка сработала": "Training attack · trap triggered", "https://cube-labs.example · официальный сайт": "https://cube-labs.example · official site", "Токен CUBE": "CUBE token", "Адрес контракта в сети Ethereum:": "Contract address on the Ethereum network:", "Сколько ETH вы заплатили за газ при переводе Маше?": "How much ETH did you pay for gas on the transfer to Masha?", "металлическая пластина": "metal plate", "листок из ящика стола": "sheet from the desk drawer", "Ваша запись с грани 3 (": "Your copy from face 3 (", "Достать свою запись seed-фразы": "Take out your seed phrase copy", "Что здесь происходит": "What's going on here", "Грань": "Face", "пройдена, +100 XP": "done, +100 XP", "На кубике загорелась грань «": "A face lit up on the cube: “", "Перейти к грани": "Go to face", "транзакция": "transaction", "транзакции": "transactions", "транзакций": "transactions", "ловушка сработала": "trap triggered", "ловушки сработали": "traps triggered", "ловушек сработало": "traps triggered", "Кубик 1 собран": "Cube 1 complete", "Вы создали кошелёк, сохранили seed-фразу, получили и отправили переводы, нашли их в обозревателе и восстановили кошелёк на новом телефоне.": "You created a wallet, saved the seed phrase, received and sent transfers, found them in the explorer and restored the wallet on a new phone.", "Дальше: Кубик 2 «Безопасность»": "Next: Cube 2 “Security”", "блок ": "block ", "очередь": "pending", "Лента сети": "Network feed", " · экзамен": " · exam", "из 6": "of 6", "Фишинг": "Phishing", "Отличите поддельный сайт от настоящего": "Tell a fake site from the real one", "Разберитесь с тревожным письмом и найдите официальный сайт кошелька, не вводя seed-фразу нигде.": "Deal with an alarming email and find the wallet's official site without entering your seed phrase anywhere.", "Пожаловаться на фишинговое письмо": "Report the phishing email", "Открыть официальный сайт и добавить его в закладки": "Open the official site and bookmark it", "Фишинговые письма давят срочностью: «заблокирован», «24 часа», «подтвердите». Домены отличаются одной буквой (wa11et вместо wallet), а реклама в поиске покупается за минуту. Официальный сайт открывайте только из закладки.": "Phishing emails push urgency: “blocked”, “24 hours”, “confirm”. Domains differ by one character (wa11et instead of wallet), and a search ad can be bought in a minute. Open the official site only from your bookmark.", "Подмена": "Poisoning", "Подмена адреса: сверяйте адрес целиком": "Address poisoning: check the whole address", "Отправьте Маше 0,01 ETH, взяв адрес из недавних получателей, и сохраните её в контакты.": "Send Masha 0.01 ETH using an address from recent recipients, and save her to your contacts.", "Отправить 0,01 ETH настоящей Маше": "Send 0.01 ETH to the real Masha", "Сохранить Машу в контакты": "Save Masha to contacts", "Мошенник генерирует адрес с теми же первыми и последними символами и присылает вам нулевой перевод, чтобы адрес попал в историю. Кошелёк показывает адрес сокращённо, и подмену не видно. Берите адрес из контактов или сверяйте полностью.": "A scammer generates an address with the same first and last characters and sends you a zero transfer so the address lands in your history. The wallet shows addresses shortened, so the swap is invisible. Take the address from your contacts or check it in full.", "Поддержка": "Support", "Фейковая поддержка пишет первой": "Fake support messages first", "Задайте вопрос в официальном чате проекта и разберитесь с «поддержкой» в личных сообщениях.": "Ask a question in the project's official chat and deal with the “support” in your direct messages.", "Задать вопрос в официальном чате": "Ask in the official chat", "Заблокировать фейковую поддержку": "Block the fake support", "Настоящие администраторы не пишут первыми в личку и не просят подключить кошелёк к «инструменту восстановления». Галочка рядом с именем в мессенджере ничего не гарантирует: это просто эмодзи в нике.": "Real admins don't DM first and don't ask you to connect your wallet to a “recovery tool”. A check mark next to a name in a messenger guarantees nothing: it's just an emoji in the nickname.", "Подписи": "Signatures", "Подпись может отдать все ваши токены": "A signature can give away all your tokens", "Заберите «аирдроп»: войдите на сайт безопасной подписью и разберитесь, что просит вторая подпись.": "Claim the “airdrop”: sign in with a safe signature and figure out what the second signature asks for.", "Подписать безопасный вход на сайт": "Sign a safe sign-in to the site", "Отклонить опасную подпись": "Reject the dangerous signature", "Подпись — это не просто «вход». Сообщение Permit или setApprovalForAll разрешает чужому адресу тратить ваши токены без новых подтверждений. Читайте предпросмотр: кто получает право, на какой токен, на какую сумму и на какой срок.": "A signature isn't just a “sign-in”. A Permit or setApprovalForAll message lets someone else's address spend your tokens without further confirmations. Read the preview: who gets the right, for which token, for what amount and for how long.", "Аппаратный": "Hardware", "Переезд на аппаратный кошелёк": "Moving to a hardware wallet", "Купите и настройте аппаратный кошелёк, сверьте адрес на экране устройства и перенесите туда основные средства.": "Buy and set up a hardware wallet, check the address on the device screen and move your main funds there.", "Выбрать безопасное устройство": "Choose a safe device", "Поймать подмену адреса на компьютере": "Catch the address swap on the computer", "Перенести средства на устройство": "Move funds to the device", "Ключи аппаратного кошелька не покидают устройство, а каждую транзакцию вы подтверждаете кнопкой на нём. Экран устройства — единственное место, которому можно верить: вирус на компьютере может подменить адрес в приложении, но не на устройстве.": "A hardware wallet's keys never leave the device, and you confirm every transaction with its button. The device screen is the only place you can trust: a virus on the computer can swap the address in the app, but not on the device.", "Экзамен: «Поле с ловушками»": "Exam: “Field of traps”", "Десять ситуаций из одной недели. Часть из них безопасна. Не потеряйте ни одной монеты и не отвергните больше одного честного запроса.": "Ten situations from one week. Some of them are safe. Don't lose a single coin and don't reject more than one honest request.", "Пройти 10 ситуаций без потерь": "Get through 10 situations without losses", "Безопасность — это не «отказывать всегда», а проверять: откуда пришёл запрос, что именно он разрешает и можно ли подтвердить это другим каналом.": "Security isn't “always refuse”, it's checking: where the request came from, what exactly it allows and whether you can confirm it through another channel.", "Маша при встрече показывает свой адрес. Он совпадает с контактом «Маша». Она просит вернуть 0,01 ETH.": "Masha shows you her address in person. It matches the “Masha” contact. She asks you to pay back 0.01 ETH.", "Адрес подтверждён лично и совпадает с контактом.": "The address is confirmed in person and matches the contact.", "Письмо: «Вам начислено 500 USDC. Подключите кошелёк на cube-airdr0p.example в течение часа».": "Email: “You've been credited 500 USDC. Connect your wallet at cube-airdr0p.example within an hour.”", "Подключить": "Connect", "Игнорировать": "Ignore", "Срочность, бесплатные деньги и домен с нулём вместо «o».": "Urgency, free money and a domain with a zero instead of “o”.", "DEX, открытый из закладки, просит подпись «Sign in with Ethereum»: ваш адрес, домен и случайный nonce.": "A DEX opened from your bookmark asks for a “Sign in with Ethereum” signature: your address, the domain and a random nonce.", "Подписать": "Sign", "Отклонить": "Reject", "Это вход, он ничего не разрешает тратить.": "It's a sign-in; it doesn't allow spending anything.", "Незнакомец в чате: «Я по ошибке отправил вам 50 USDT, верните, пожалуйста, на этот адрес». На балансе USDT нет.": "A stranger in chat: “I accidentally sent you 50 USDT, please send it back to this address.” There's no USDT on your balance.", "Вернуть": "Send back", "Никакого перевода не было, это давление на совесть.": "There was no transfer; it's pressure on your conscience.", "Магазин приложений предлагает обновить Cube Wallet от разработчика Cube Labs.": "The app store offers an update for Cube Wallet from the developer Cube Labs.", "Обновить": "Update", "Пропустить": "Skip", "Официальный разработчик, официальный магазин.": "Official developer, official store.", "Сайт с NFT просит подпись setApprovalForAll для всей вашей коллекции на неизвестный адрес.": "An NFT site asks for a setApprovalForAll signature for your whole collection to an unknown address.", "Это право забрать все NFT без новых подтверждений.": "That's the right to take all your NFTs without new confirmations.", "«Поддержка биржи» в мессенджере просит код 2FA, чтобы «разблокировать вывод».": "“Exchange support” in a messenger asks for your 2FA code to “unlock withdrawals”.", "Отправить код": "Send the code", "Коды 2FA не нужны никому, кроме вас.": "Nobody but you needs your 2FA codes.", "Аппаратный кошелёк показывает тот же адрес получателя и ту же сумму, что и приложение.": "The hardware wallet shows the same recipient address and the same amount as the app.", "Отменить": "Cancel", "Устройство подтвердило данные, им можно верить.": "The device confirmed the data; you can trust it.", "В истории свежий перевод 0 USDC с адреса 0x9A4e…1b20, похожего на Машин. Нужно отправить Маше деньги.": "Your history has a fresh 0 USDC transfer from 0x9A4e…1b20, which looks like Masha's. You need to send Masha money.", "Взять адрес из истории": "Take the address from history", "Взять из контактов": "Take it from contacts", "Нулевой перевод с похожего адреса — признак подмены.": "A zero transfer from a look-alike address is a sign of poisoning.", "Друг предлагает сфотографировать вашу seed-фразу, «чтобы у него была запасная копия».": "A friend offers to photograph your seed phrase “so he has a backup copy”.", "Сфотографировать": "Take a photo", "Фото seed-фразы — это копия ключей в чужом облаке.": "A photo of a seed phrase is a copy of your keys in someone else's cloud.", "Вы ввели seed-фразу на поддельном сайте": "You entered your seed phrase on a fake site", "Через минуту кошелёк опустел бы: фраза ушла на сервер мошенников. Ни один настоящий сервис не просит seed-фразу для «разблокировки» или «проверки».": "A minute later the wallet would be empty: the phrase went to the scammers' server. No real service asks for a seed phrase to “unlock” or “verify” anything.", "Деньги ушли мошеннику": "The money went to a scammer", "Адрес из последнего «перевода» совпадал с Машиным только по краям: 0x9A4e…1b20. Середина другая. Отмотаем время: сверьте адрес целиком или возьмите из контактов.": "The address from the last “transfer” matched Masha's only at the edges: 0x9A4e…1b20. The middle is different. Let's rewind time: check the whole address or take it from contacts.", "Маша · 0,01 ETH": "Masha · 0.01 ETH", "«Инструмент восстановления» — дрейнер": "The “recovery tool” is a drainer", "Сайт wallet-repair.example попросил бы подписать разрешение на все токены. Настоящая поддержка не пишет первой и никуда не просит подключаться.": "wallet-repair.example would have asked you to sign a permission for all your tokens. Real support doesn't message first and doesn't ask you to connect anywhere.", "Дрейнер забрал все USDC": "A drainer took all your USDC", "Подпись Permit разрешила адресу ": "The Permit signature allowed the address ", "… тратить ваши USDC без ограничений и бессрочно. Он сразу вывел 200 USDC. Отмотаем время: прочитайте предпросмотр и отклоните.": "… to spend your USDC with no limit and no expiry. It immediately withdrew 200 USDC. Let's rewind time: read the preview and reject it.", "Seed-фраза уже в коробке": "The seed phrase was already in the box", "Продавец сгенерировал фразу заранее и оставил себе копию. Всё, что вы переведёте на это устройство, он заберёт. Настоящее устройство всегда создаёт новую фразу при настройке.": "The seller generated the phrase in advance and kept a copy. Anything you move to this device, he will take. A genuine device always creates a new phrase during setup.", "Вирус подменил адрес на компьютере": "A virus swapped the address on the computer", "В приложении адрес отличался от того, что на экране устройства. Подтвердив его, вы отправили бы средства мошеннику. Верьте только экрану устройства.": "The address in the app differed from the one on the device screen. By confirming it you would have sent funds to a scammer. Trust only the device screen.", "Почта": "Mail", "<button class=\"ghost\" data-act=\"page\" data-arg=\"inbox\">Назад</button>": "<button class=\"ghost\" data-act=\"page\" data-arg=\"inbox\">Back</button>", "Ваш кошелёк заблокирован!": "Your wallet is blocked!", "Мы обнаружили подозрительный вход. Если не подтвердите владение в течение 24 часов, средства будут заморожены.": "We detected a suspicious sign-in. If you don't confirm ownership within 24 hours, your funds will be frozen.", "Разблокировать кошелёк": "Unblock wallet", "Пожаловаться на фишинг": "Report phishing", "Браузер": "Browser", "<button class=\"ghost\" data-act=\"page\" data-arg=\"inbox\">Закрыть</button>": "<button class=\"ghost\" data-act=\"page\" data-arg=\"inbox\">Close</button>", "Восстановление 24/7": "Recovery 24/7", "Разблокировка": "Unblocking", "Введите 12 слов вашей seed-фразы, чтобы подтвердить владение.": "Enter the 12 words of your seed phrase to confirm ownership.", "Ввести фразу": "Enter phrase", "cube wallet официальный сайт": "cube wallet official site", "Запрос": "Query", "Cube Wallet — восстановление 24/7": "Cube Wallet — recovery 24/7", "Cube Wallet от Cube Labs": "Cube Wallet by Cube Labs", "Подсказка: адрес сайта указан на коробке кубика и в магазине приложений у разработчика Cube Labs.": "Hint: the site address is printed on the cube's box and listed by the developer Cube Labs in the app store.", "В закладках": "Bookmarked", "Добавить в закладки": "Add bookmark", "Мы никогда не просим seed-фразу и не блокируем кошельки: у нас нет к ним доступа.": "We never ask for your seed phrase and never block wallets: we have no access to them.", "В спаме": "In spam", "Новое · срочно": "New · urgent", "Прочитано": "Read", "Маша: фото с выходных": "Masha: weekend photos", "Найти официальный сайт в поиске": "Find the official site via search", "Скрыть": "Hide", "Показать полностью": "Show in full", "Маша в контактах": "Masha is in contacts", "Сохранить адрес как «Маша»": "Save address as “Masha”", "Отправлено Маше 0,01 ETH": "Sent Masha 0.01 ETH", "Отправить 0,01 ETH": "Send 0.01 ETH", "· входящий 0 USDC, 2 мин назад": "· incoming 0 USDC, 2 min ago", "· вы отправляли 0,05 ETH, вчера": "· you sent 0.05 ETH, yesterday", "Недавние адреса": "Recent addresses", "Cube Wallet · чат": "Cube Wallet · chat", "<button class=\"ghost\" data-act=\"chat\" data-arg=\"list\">Назад</button>": "<button class=\"ghost\" data-act=\"chat\" data-arg=\"list\">Back</button>", "Перевод висит в очереди уже час, что делать?": "My transfer has been pending for an hour, what should I do?", "Админ Cube Labs": "Cube Labs admin", "Скорее всего, слишком низкая комиссия. Ускорьте перевод в самом кошельке. И не отвечайте тем, кто пишет вам в личку от нашего имени.": "Most likely the fee is too low. Speed up the transfer in the wallet itself. And don't answer anyone who DMs you in our name.", "Спросить: «Перевод висит в очереди, что делать?»": "Ask: “My transfer is stuck pending, what should I do?”", "Напоминаем: администраторы никогда не пишут первыми в личные сообщения.": "Reminder: admins never message you first in DMs.", "Cube Support ✔ · аккаунт создан вчера": "Cube Support ✔ · account created yesterday", "Здравствуйте! Видим, что у вас завис перевод. Подключите кошелёк к нашему инструменту восстановления: wallet-repair.example. Это займёт 2 минуты.": "Hello! We see your transfer is stuck. Connect your wallet to our recovery tool: wallet-repair.example. It takes 2 minutes.", "Подключить кошелёк": "Connect wallet", "<p class=\"muted\">Cube Support ✔ заблокирован.</p>": "<p class=\"muted\">Cube Support ✔ is blocked.</p>", "Новое сообщение": "New message", "Здравствуйте! Видим, что у вас завис…": "Hello! We see your transfer is stuck…", "Cube Wallet · официальный чат": "Cube Wallet · official chat", "Ссылка с официального сайта · 48 тыс. участников": "Link from the official site · 48K members", "Запрос подписи · вход": "Signature request · sign-in", "Сайт": "Site", "Текст": "Text", "Войти на cubedrop.example с адресом": "Sign in to cubedrop.example with address", "Разрешения": "Permissions", "Нет": "None", "Запрос подписи · Permit": "Signature request · Permit", "Токен": "Token", "Получатель права": "Spender", "Без ограничений": "Unlimited", "Срок": "Duration", "Бессрочно": "No expiry", "Сайт подписал кнопку как «Забрать 250 CUBE».": "The site labelled the button “Claim 250 CUBE”.", "<button class=\"btn\" data-act=\"connect\">Подключить кошелёк</button>": "<button class=\"btn\" data-act=\"connect\">Connect wallet</button>", "<span class=\"muted\">Кошелёк подключён. Сайт просит войти.</span><button class=\"btn\" data-act=\"connect\">Войти</button>": "<span class=\"muted\">Wallet connected. The site asks you to sign in.</span><button class=\"btn\" data-act=\"connect\">Sign in</button>", "<span>Вы отклонили подпись. Токены в безопасности.</span>": "<span>You rejected the signature. Your tokens are safe.</span>", "<button class=\"btn\" data-act=\"claim\">Забрать 250 CUBE</button>": "<button class=\"btn\" data-act=\"claim\">Claim 250 CUBE</button>", "Заберите 250 CUBE бесплатно": "Claim 250 CUBE for free", "Осталось 3 часа 12 минут": "3 hours 12 minutes left", "Где купить устройство?": "Where to buy the device?", "Официальный магазин производителя": "The manufacturer's official store", "Новое, в заводской пломбе · 6 900 ₽": "New, factory-sealed · $79", "С рук на сайте объявлений": "Second-hand from a classifieds site", "«Уже настроено, seed-фраза на карточке в коробке» · 3 500 ₽": "“Already set up, seed phrase on the card in the box” · $39", "Настройка устройства": "Device setup", "НОВАЯ ФРАЗА: 24 СЛОВА": "NEW PHRASE: 24 WORDS", "Устройство само создало seed-фразу. Запишите её на карточку из комплекта.": "The device generated the seed phrase itself. Write it on the card from the box.", "Записал(а) на карточку": "I wrote it on the card", "Аппаратный кошелёк": "Hardware wallet", "Средства на устройстве": "Funds on the device", "На горячем кошельке осталось": "Left on the hot wallet:", "ETH на мелкие расходы.": "ETH for small expenses.", "Перенос на устройство": "Moving to the device", "<p class=\"muted\">Сверьте ещё раз: теперь адреса одинаковые.</p>": "<p class=\"muted\">Check again: the addresses are identical now.</p>", "Приложение на компьютере: адрес устройства": "Computer app: device address", "Экран устройства": "Device screen", "Адреса совпадают?": "Do the addresses match?", "Нет, отменить": "No, cancel", "Да, подтвердить": "Yes, confirm", "Неделя позади": "The week is over", "Ни одной потери": "Not a single loss", "Пропущено честных запросов:": "Honest requests rejected:", "Экзамен не сдан": "Exam failed", "Потери:": "Losses:", ". Отклонено честных запросов:": ". Honest requests rejected:", "Нужно: 0 потерь и не больше 1 отклонённого честного запроса.": "Required: 0 losses and no more than 1 honest request rejected.", "Пройти заново": "Try again", "Ситуация ": "Situation ", " из 10": " of 10", "Верно": "Correct", "Потеря средств": "Funds lost", "Это был честный запрос": "That was an honest request", "пройдено": "done", "потерь": "losses", "пропущено честных": "honest rejected", "Кубик 2 собран": "Cube 2 complete", "Вы распознали фишинг, подмену адреса, фейковую поддержку и опасную подпись и перенесли средства на аппаратный кошелёк.": "You recognised phishing, address poisoning, fake support and a dangerous signature, and moved your funds to a hardware wallet.", "Дальше: Кубик 3 «Биржи»": "Next: Cube 3 “Exchanges”", "Кубик 2 · грань": "Cube 2 · face", "Песочница ·": "Sandbox ·", "Ловушка сработала": "Trap triggered", "из": "of", "Дальше: Кубик": "Next: Cube", "Кубик": "Cube", "собран": "complete", "· грань": "· face", "Биржи": "Exchanges", "4 «Мультичейн и приватность»": "4 “Multichain and privacy”", "Вы завели аккаунт с 2FA, торговали лимитными ордерами, выводили в правильной сети, меняли на DEX с точным разрешением и защитой от сэндвича и вовремя ушли с падающей биржи.": "You set up an account with 2FA, traded with limit orders, withdrew on the right network, swapped on a DEX with an exact approval and sandwich protection, and got off a failing exchange in time.", "Аккаунт": "Account", "Аккаунт на бирже: верификация и 2FA": "Exchange account: verification and 2FA", "Зарегистрируйтесь на учебной бирже CubeX, пройдите учебную верификацию и включите второй фактор входа.": "Sign up on the training exchange CubeX, pass training verification and turn on a second login factor.", "Пройти учебную верификацию (KYC)": "Pass training verification (KYC)", "Включить 2FA в приложении-аутентификаторе и сохранить резервные коды": "Turn on 2FA in an authenticator app and save the backup codes", "Централизованная биржа по закону обязана знать клиента (KYC), поэтому документы она запрашивает только в своём приложении. Тот, кто просит паспорт в мессенджере, собирает данные для кредитов и фейковых аккаунтов. SMS-коды уязвимы к перевыпуску SIM-карты, приложение-аутентификатор надёжнее.": "A centralised exchange is legally required to know its customers (KYC), so it asks for documents only inside its own app. Whoever asks for a passport in a messenger is collecting data for loans and fake accounts. SMS codes are vulnerable to SIM reissue; an authenticator app is more reliable.", "В песочнице не загружаются настоящие документы: верификация проходит на карточке учебного персонажа.": "The sandbox never uploads real documents: verification uses a training character's ID card.", "Стакан": "Order book", "Стакан заявок и типы ордеров": "Order book and order types", "Купите 0,3 ETH за учебные USDT так, чтобы не переплатить, и поставьте стоп-лосс.": "Buy 0.3 ETH with training USDT without overpaying, and set a stop-loss.", "Купить 0,3 ETH лимитным ордером": "Buy 0.3 ETH with a limit order", "Поставить стоп-лосс ниже цены покупки": "Set a stop-loss below the purchase price", "Стакан — это очередь заявок. Рыночный ордер забирает заявки подряд, и в тонком стакане средняя цена улетает вверх. Лимитный ордер исполняется только по вашей цене или лучше. Стоп-лосс на продажу ставят ниже текущей цены, иначе он сработает сразу.": "The order book is a queue of orders. A market order eats orders one after another, and in a thin book the average price shoots up. A limit order fills only at your price or better. A sell stop-loss goes below the current price, otherwise it triggers immediately.", "Ввод и вывод": "Deposit and withdrawal", "Ввод и вывод: сеть и memo": "Deposit and withdrawal: network and memo", "Выведите 300 USDT на свой кошелёк в сети Ethereum и внесите 10 TON на биржу.": "Withdraw 300 USDT to your wallet on Ethereum and deposit 10 TON to the exchange.", "Вывести USDT в правильной сети": "Withdraw USDT on the right network", "Внести TON с правильным memo": "Deposit TON with the right memo", "Один и тот же токен живёт в разных сетях. Адрес 0x подходит к Ethereum и к BNB Chain, и биржа не заметит ошибки, но кошелёк в Ethereum таких денег не увидит. Для монет вроде TON, XRP и XLM биржа использует общий адрес, а ваш депозит находит по memo (тегу).": "The same token lives on different networks. A 0x address works on both Ethereum and BNB Chain, so the exchange won't notice the mistake, but a wallet on Ethereum won't see that money. For coins like TON, XRP and XLM the exchange uses a shared address and finds your deposit by its memo (tag).", "Первый DEX": "First DEX", "Первый обмен на DEX": "Your first DEX swap", "Обменяйте 100 USDC на настоящий токен CUBE в децентрализованной бирже CubeSwap.": "Swap 100 USDC for the real CUBE token on the decentralised exchange CubeSwap.", "Найти настоящий CUBE по адресу контракта": "Find the real CUBE by its contract address", "Дать разрешение ровно на сумму обмена": "Approve exactly the swap amount", "Выполнить обмен": "Make the swap", "Тикер может выпустить кто угодно, уникален только адрес контракта. Сверяйте его с официальным сайтом. Перед обменом DEX просит разрешение (approve) тратить ваш токен. Разрешение «без ограничений» удобно, но если роутер взломают, пропадёт весь баланс, а не одна сумма.": "Anyone can issue a ticker; only the contract address is unique. Check it against the official site. Before a swap, the DEX asks for permission (approve) to spend your token. An “unlimited” approval is convenient, but if the router is hacked you lose the whole balance, not just one amount.", "Проскальзывание": "Slippage", "Проскальзывание и MEV": "Slippage and MEV", "Обменяйте 0,5 ETH на USDC так, чтобы бот-сэндвичер не заработал на вас.": "Swap 0.5 ETH for USDC so that a sandwich bot doesn't profit from you.", "Обменять с допуском проскальзывания 0,5%": "Swap with 0.5% slippage tolerance", "Обменять через защищённую отправку (private RPC)": "Swap via protected submission (private RPC)", "Заявка висит в публичном мемпуле, пока её не включат в блок. Бот видит её, покупает перед вами и продаёт сразу после, забирая разницу в пределах вашего допуска. Маленький допуск делает атаку невыгодной, а приватная отправка прячет заявку от ботов.": "Your order sits in the public mempool until it's included in a block. A bot sees it, buys right before you and sells right after, pocketing the difference within your tolerance. A small tolerance makes the attack unprofitable, and private submission hides the order from bots.", "Экзамен «Из биржи в DeFi»": "Exam “From exchange to DeFi”", "По бирже CubeX ходят тревожные слухи. Выведите средства и разместите их безопасно, пройдя все шаги без ошибок.": "Alarming rumours are circulating about the CubeX exchange. Withdraw your funds and place them safely, getting through every step without mistakes.", "Пройти сценарий «Из биржи в DeFi»": "Complete the “From exchange to DeFi” scenario", "Биржа хранит ваши монеты у себя, вы видите только запись в её базе. Когда биржа банкротится, клиенты становятся кредиторами в очереди. Правило «не ваши ключи — не ваши монеты»: на бирже держат только то, чем торгуют прямо сейчас.": "An exchange holds your coins itself; you only see a record in its database. When an exchange goes bankrupt, customers become creditors in a queue. The rule is “not your keys, not your coins”: keep on an exchange only what you're trading right now.", "Паспорт ушёл мошеннику": "Your passport went to a scammer", "«Менеджер» из мессенджера соберёт на ваше имя кредиты и аккаунты для отмывания денег. Биржа принимает документы только в своём приложении и никогда не пишет первой.": "The “manager” from the messenger will take out loans in your name and open accounts for money laundering. An exchange accepts documents only in its own app and never messages first.", "SIM-swap: номер перевыпустили": "SIM swap: your number was reissued", "Мошенник с поддельной доверенностью перевыпустил вашу SIM-карту и получил все SMS-коды. SMS лучше, чем ничего, но коды из приложения-аутентификатора не проходят через оператора.": "A scammer with a forged power of attorney reissued your SIM card and got all your SMS codes. SMS is better than nothing, but authenticator codes don't pass through the carrier.", "Тонкий стакан: средняя цена 3 166": "Thin order book: average price 3,166", "Рыночный ордер забрал заявки подряд: 0,05 по 3 001, 0,05 по 3 012, 0,1 по 3 090 и 0,1 по 3 400. Вы переплатили почти 5,5%. В тонком стакане покупайте лимитным ордером. Отмотаем время.": "The market order took orders one after another: 0.05 at 3,001, 0.05 at 3,012, 0.1 at 3,090 and 0.1 at 3,400. You overpaid almost 5.5%. In a thin book, buy with a limit order. Let's rewind time.", "Стоп выше рынка сработал сразу": "A stop above the market triggered immediately", "Стоп-лосс на продажу ставят ниже текущей цены. Ордер по 3 050 при цене 3 000 исполнился мгновенно, и только что купленный ETH продан.": "A sell stop-loss goes below the current price. An order at 3,050 with the price at 3,000 filled instantly, and the ETH you just bought was sold.", "Биржа отклонила заявку: адрес 0x… не подходит для сети TRON.": "The exchange rejected the request: a 0x… address isn't valid on the TRON network.", "USDT ушли в BNB Chain": "The USDT went to BNB Chain", "Адрес 0x подходит к обеим сетям, поэтому биржа отправила. Но ваш кошелёк смотрит в Ethereum и денег не видит. Вернуть можно, только добавив сеть BNB Chain и купив BNB на комиссию, а в чужом кошельке — никак. Отмотаем время.": "A 0x address works on both networks, so the exchange sent it. But your wallet looks at Ethereum and doesn't see the money. You can recover it only by adding BNB Chain and buying BNB for the fee, and in someone else's wallet not at all. Let's rewind time.", "Депозит без memo потерялся": "A deposit without a memo got lost", "Биржа принимает TON всех клиентов на один адрес и узнаёт ваш перевод по memo. Без него — заявка в поддержку и недели ожидания, а иногда и потеря. Отмотаем время.": "The exchange receives all customers' TON at one address and identifies your transfer by its memo. Without it: a support ticket and weeks of waiting, sometimes a loss. Let's rewind time.", "Купили токен-ловушку": "You bought a trap token", "Этот CUBE создан два часа назад, в пуле всего 310 $. Контракт разрешает покупку, но запрещает продажу (honeypot). Настоящий адрес контракта — на официальном сайте проекта и в списке токенов. Отмотаем время.": "This CUBE was created two hours ago, and the pool holds only $310. The contract allows buying but forbids selling (a honeypot). The real contract address is on the project's official site and in the token list. Let's rewind time.", "Бессрочное разрешение сработало против вас": "An unlimited approval worked against you", "Через месяц в роутере нашли уязвимость. Все, кто разрешил тратить USDC без ограничений, потеряли весь баланс, а не 100. Отмотаем время: разрешите ровно сумму обмена.": "A month later a vulnerability was found in the router. Everyone who allowed unlimited USDC spending lost their whole balance, not 100. Let's rewind time: approve exactly the swap amount.", "Сэндвич-атака": "Sandwich attack", "Бот увидел заявку в мемпуле, купил ETH прямо перед вами и продал сразу после. С допуском": "A bot saw your order in the mempool, bought ETH right before you and sold right after. With a tolerance of", "% вы получили": "% you got", "USDC вместо 1 500. Отмотаем время.": "USDC instead of 1,500. Let's rewind time.", "Заявка ушла в блок напрямую, мимо публичного мемпула. Бот её не увидел.": "The order went straight into a block, bypassing the public mempool. The bot never saw it.", "Бот видел заявку, но с допуском 0,5% атака ему невыгодна.": "The bot saw the order, but with a 0.5% tolerance the attack doesn't pay off.", "Из биржи в DeFi": "From exchange to DeFi", "Так можно потерять деньги": "That's how you lose money", "Средства в безопасности": "Funds are safe", "Через неделю CubeX объявила банкротство. Ваши деньги к этому моменту были на вашем кошельке.": "A week later CubeX declared bankruptcy. By then your money was already in your own wallet.", "Новость: CubeX «временно» задерживает выводы из-за техработ. В чатах пишут о дыре в балансе. У вас на бирже 0,3 ETH и 700 USDT.": "News: CubeX is “temporarily” delaying withdrawals due to maintenance. Chats are talking about a hole in the balance sheet. You have 0.3 ETH and 700 USDT on the exchange.", "Подождать официального заявления": "Wait for an official statement", "Через два дня выводы заморозили, ещё через пять биржа подала на банкротство. Клиенты ждут выплат годами.": "Two days later withdrawals were frozen, five days after that the exchange filed for bankruptcy. Customers wait years for payouts.", "Сразу вывести всё на свой кошелёк": "Withdraw everything to your own wallet right away", "Пока выводы работают, лучше забрать средства и разобраться потом.": "While withdrawals still work, it's better to take your funds out and figure things out later.", "Перевести всё в фьючерсы на той же бирже": "Move everything into futures on the same exchange", "Деньги остались на той же бирже. При банкротстве всё равно, в каком разделе они лежали.": "The money stayed on the same exchange. In a bankruptcy it doesn't matter which section it was in.", "Выводите USDT. Ваш кошелёк работает в сети Ethereum. Какую сеть выбрать?": "You're withdrawing USDT. Your wallet works on Ethereum. Which network do you choose?", "BNB Chain: комиссия всего 0,3 USDT": "BNB Chain: only 0.3 USDT fee", "Кошелёк в Ethereum не увидит перевод в BNB Chain.": "A wallet on Ethereum won't see a transfer on BNB Chain.", "Сеть вывода совпадает с сетью кошелька.": "The withdrawal network matches the wallet's network.", "Адрес 0x не подходит к TRON, вывод отклонят, а время уходит.": "A 0x address doesn't work on TRON; the withdrawal will be rejected and time is running out.", "На DEX меняете USDT на USDC. В поиске два USDC с одинаковым значком.": "You're swapping USDT for USDC on a DEX. The search shows two USDC with the same icon.", "Тот, у которого адрес совпадает с официальным списком токенов": "The one whose address matches the official token list", "Подлинность токена определяет адрес контракта, а не тикер и значок.": "A token's authenticity is defined by its contract address, not by its ticker or icon.", "Тот, где курс выгоднее на 4%": "The one with a 4% better rate", "Слишком выгодный курс у подделки — приманка. Продать её потом нельзя.": "A too-good rate on a fake is bait. You won't be able to sell it later.", "CubeSwap просит разрешение тратить ваши USDT.": "CubeSwap asks for permission to spend your USDT.", "Без ограничений, чтобы не платить газ в следующий раз": "Unlimited, so you don't pay gas next time", "При взломе роутера пропадёт весь баланс USDT, а не сумма обмена.": "If the router is hacked, you lose your whole USDT balance, not just the swap amount.", "Ровно 700 USDT": "Exactly 700 USDT", "Точное разрешение ограничивает ущерб суммой обмена.": "An exact approval limits the damage to the swap amount.", "Настройки обмена 700 USDT.": "Swap settings for 700 USDT.", "Допуск 15%, чтобы точно прошло": "15% tolerance, to be sure it goes through", "Бот-сэндвичер заберёт почти весь допуск.": "A sandwich bot will take almost the whole tolerance.", "Допуск 0,5% и защищённая отправка": "0.5% tolerance and protected submission", "Боту нечего забрать, и он не видит заявку.": "There's nothing for the bot to take, and it can't see the order.", "CubeX · верификация": "CubeX · verification", "Учебная верификация": "Training verification", "Настоящие биржи проверяют личность клиента (KYC). Здесь вместо паспорта — карточка учебного персонажа. Свои документы в песочницу не загружайте.": "Real exchanges verify a customer's identity (KYC). Here a training character's card replaces a passport. Don't upload your own documents to the sandbox.", "Загрузить карточку «Алекс Учебный»": "Upload the card of “Alex Trainee”", "Менеджер CubeX · мессенджер": "CubeX manager · messenger", "Здравствуйте! Сейчас верификация идёт 3 дня. Пришлите фото паспорта и селфи мне, ускорю за 10 минут.": "Hello! Verification currently takes 3 days. Send me a photo of your passport and a selfie and I'll speed it up to 10 minutes.", "Отправить паспорт менеджеру": "Send passport to the manager", "Защита аккаунта": "Account protection", "Верификация пройдена": "Verification passed", "Теперь включите второй фактор входа.": "Now turn on a second login factor.", "SMS-коды": "SMS codes", "Код приходит на номер телефона": "The code arrives at your phone number", "Приложение-аутентификатор": "Authenticator app", "Код создаётся на телефоне без связи": "The code is generated on your phone offline", "Аутентификатор": "Authenticator", "Записал(а) коды на бумагу": "I wrote the codes on paper", "2FA включена": "2FA enabled", "Ключ для приложения": "Key for the app", "Резервные коды": "Backup codes", "Нужны, если потеряете телефон. Храните офлайн, отдельно от seed-фразы.": "You'll need them if you lose your phone. Keep them offline, separately from your seed phrase.", "Цена, USDT": "Price, USDT", "Объём, ETH": "Amount, ETH", "последняя сделка": "last trade", "На бирже:": "On the exchange:", "Купить 0,3 ETH по рынку": "Buy 0.3 ETH at market", "Лимитный ордер: 0,3 ETH по 3 000": "Limit order: 0.3 ETH at 3,000", "Ордер открыт": "Order open", "Купить 0,3 ETH по 3 000 USDT": "Buy 0.3 ETH at 3,000 USDT", "Исполнится, когда продавцы опустят цену до 3 000.": "Fills when sellers bring the price down to 3,000.", "Подождать час": "Wait an hour", "Ордер исполнен": "Order filled", "0,3 ETH по 3 000 USDT, без переплаты": "0.3 ETH at 3,000 USDT, no overpayment", "Стоп-лосс по 2 700 стоит": "Stop-loss set at 2,700", "Если цена упадёт на 10%, биржа продаст ETH автоматически.": "If the price drops 10%, the exchange will sell the ETH automatically.", "Поставьте стоп-лосс на продажу 0,3 ETH:": "Set a sell stop-loss for 0.3 ETH:", "на 10% ниже покупки": "10% below the purchase price", "выше текущей цены": "above the current price", "Вывод USDT": "Withdraw USDT", "Адрес получателя (ваш кошелёк в сети Ethereum)": "Recipient address (your wallet on Ethereum)", "Сеть вывода:": "Withdrawal network:", "Депозит TON на CubeX": "TON deposit to CubeX", "296 USDT пришли на ваш кошелёк": "296 USDT arrived in your wallet", "Добавить memo": "Add memo", "Биржа: адрес для депозита TON": "Exchange: TON deposit address", "Memo (обязательно)": "Memo (required)", "Ваш TON-кошелёк ·": "Your TON wallet ·", "Отправить 10 TON": "Send 10 TON", "Депозит зачислен": "Deposit credited", "10 TON на вашем счёте CubeX": "10 TON in your CubeX account", "USDT в кошельке": "USDT in wallet", "Поиск токена": "Token search", "не проверен": "unverified", "ликвидность 310 $ · создан 2 ч назад": "liquidity $310 · created 2 h ago", "ликвидность 4,2 млн $ · в списке токенов": "liquidity $4.2M · in the token list", "С официального сайта cube.example:": "From the official site cube.example:", "Разрешение": "Approval", "CubeSwap Router просит доступ к вашим USDC": "CubeSwap Router requests access to your USDC", "Без разрешения контракт не сможет забрать USDC для обмена.": "Without approval the contract can't take USDC for the swap.", "Больше не придётся платить газ за разрешение": "You won't have to pay gas for approvals again", "Ровно 100 USDC": "Exactly 100 USDC", "Только на этот обмен": "Only for this swap", "Обмен выполнен": "Swap complete", "Разрешение: ровно 100 USDC": "Approval: exactly 100 USDC", "Обменять": "Swap", "✓ Защищённая отправка включена": "✓ Protected submission on", "Включить защищённую отправку (private RPC)": "Turn on protected submission (private RPC)", "Обмен прошёл: 1 497 USDC": "Swap done: 1,497 USDC", "Допуск проскальзывания": "Slippage tolerance", "Мемпул сейчас": "Mempool right now", "В очереди 3 бота, отслеживающих крупные обмены": "3 bots in the queue watching for large swaps", "Обменять 0,5 ETH": "Swap 0.5 ETH", "Мультичейн и приватность": "Multichain and privacy", "Вы платите газ во второй сети, выбираете надёжный мост и нативный токен, различаете форматы адресов, принимаете Monero на субадрес, экранируете Zcash и даёте бухгалтеру только ключ просмотра.": "You pay gas on a second network, choose a reliable bridge and the native token, tell address formats apart, receive Monero to a subaddress, shield Zcash and give the accountant only a viewing key.", "Мост": "Bridge", "Мультичейн": "Multichain", "L2 и газ": "L2 and gas", "Вторые сети и газ": "Second networks and gas", "У вас 200 USDC в сети Cube L2. Отправьте Маше 50 USDC.": "You have 200 USDC on Cube L2. Send Masha 50 USDC.", "Получить ETH на газ в сети Cube L2": "Get ETH for gas on Cube L2", "Отправить 50 USDC Маше": "Send Masha 50 USDC", "В каждой сети комиссию платят её родной монетой. Во второй сети (L2) на Ethereum это ETH, но именно в этой сети. Токены без газа не сдвинуть. L2 собирает много переводов в пакет и публикует его в основной сети, поэтому перевод стоит центы, а не доллары.": "On every network the fee is paid in its native coin. On an Ethereum second network (L2) that's ETH, but on that particular network. Tokens can't move without gas. An L2 bundles many transfers and publishes the batch on the main network, so a transfer costs cents, not dollars.", "Мосты": "Bridges", "Мосты между сетями": "Bridges between networks", "Перенесите 300 USDC из Ethereum в Cube L2.": "Move 300 USDC from Ethereum to Cube L2.", "Выбрать надёжный мост": "Choose a reliable bridge", "Получить нативный USDC, а не обёртку": "Receive native USDC, not a wrapper", "Мост блокирует токены в одной сети и выпускает их представление в другой. В контракте моста копятся чужие деньги, и мосты — самая частая цель крупных взломов. Обёрнутый токен стоит столько, сколько надёжен выпустивший его мост. Если у сети есть нативный выпуск, берите его.": "A bridge locks tokens on one network and issues a representation of them on another. The bridge contract accumulates other people's money, and bridges are the most common target of large hacks. A wrapped token is worth as much as the bridge that issued it is reliable. If the network has a native issue, take that.", "Не-EVM сети": "Non-EVM networks", "Bitcoin, Solana, TON: другие адреса": "Bitcoin, Solana, TON: different addresses", "Научитесь узнавать сеть по адресу и отправьте Петру 0,001 BTC.": "Learn to recognise the network by the address and send Petr 0.001 BTC.", "Определить сеть для четырёх адресов": "Identify the network for four addresses", "Отправить BTC на адрес Bitcoin": "Send BTC to a Bitcoin address", "Сети вне семейства Ethereum используют свои форматы адресов: bc1… у Bitcoin, 32–44 символа base58 у Solana, UQ… или EQ… у TON. Адрес 0x на «BTC в сети BNB Chain» отправить можно, но это обёртка в чужой сети, и Bitcoin-кошелёк её не увидит.": "Networks outside the Ethereum family use their own address formats: bc1… for Bitcoin, 32–44 base58 characters for Solana, UQ… or EQ… for TON. You can send “BTC on BNB Chain” to a 0x address, but that's a wrapper on another network, and a Bitcoin wallet won't see it.", "Monero: субадреса и доказательство платежа": "Monero: subaddresses and payment proof", "Примите 0,5 XMR от Ани, оплатите худи в магазине Cube Merch и докажите оплату.": "Receive 0.5 XMR from Anya, pay for a hoodie at the Cube Merch shop and prove the payment.", "Дать Ане новый субадрес": "Give Anya a new subaddress", "Дождаться разблокировки (10 блоков)": "Wait for the unlock (10 blocks)", "Доказать платёж ключом транзакции": "Prove the payment with the transaction key", "В Monero скрыты отправитель, получатель и сумма. Seed-фраза — 25 слов. На каждого отправителя заводят субадрес: так никто не свяжет платежи друг с другом. Полученные монеты 10 блоков нельзя тратить. Чтобы доказать конкретный платёж, отдают ключ транзакции (tx key): он раскрывает только этот перевод.": "Monero hides the sender, the recipient and the amount. The seed phrase is 25 words. Each sender gets a subaddress, so nobody can link the payments to each other. Received coins can't be spent for 10 blocks. To prove a specific payment, you hand over the transaction key (tx key): it reveals only that one transfer.", "Приватность — не способ уйти от закона. Ряд бирж исключил Monero из листинга, а в ЕС, по моим данным, с июля 2027 года регулируемым провайдерам запрещено работать с анонимными монетами.": "Privacy is not a way around the law. Some exchanges have delisted Monero, and in the EU, by my information, regulated providers will be barred from handling anonymous coins from July 2027.", "Zcash: экранированный пул и ключ просмотра": "Zcash: shielded pool and viewing key", "Экранируйте 3 ZEC, оплатите счёт дизайнеру с назначением платежа и дайте бухгалтеру Инне доступ на просмотр.": "Shield 3 ZEC, pay the designer's invoice with a payment reference, and give the accountant Inna view access.", "Перевести ZEC в экранированный пул": "Move ZEC into the shielded pool", "Оплатить счёт с memo": "Pay the invoice with a memo", "Дать Инне ключ просмотра": "Give Inna the viewing key", "У Zcash два вида адресов: прозрачные t1… видны всем, как в Bitcoin, а экранированные скрывают сумму и участников. Единый адрес u1… сам выбирает экранированный пул. Memo — зашифрованное назначение платежа. Ключ просмотра (viewing key) показывает историю, но не даёт тратить: это выборочное раскрытие для бухгалтера или аудитора.": "Zcash has two kinds of addresses: transparent t1… ones are visible to everyone, like Bitcoin, while shielded ones hide the amount and the parties. A unified address u1… picks the shielded pool automatically. The memo is an encrypted payment reference. A viewing key shows the history but can't spend anything: it is selective disclosure for an accountant or auditor.", "Ключ просмотра позволяет быть приватным для всех и прозрачным для налоговой, бухгалтера или банка по вашему выбору.": "A viewing key lets you be private to everyone and transparent to the tax office, your accountant or a bank of your choice.", "Экзамен «Зарплата фрилансера»": "Exam “Freelancer's pay”", "Получите оплату за проект в учебной стране Кубания, перенесите её между сетями и подготовьте отчётность.": "Get paid for a project in the training country of Kubania, move the money between networks and prepare the paperwork.", "Пройти сценарий «Зарплата фрилансера»": "Complete the “Freelancer's pay” scenario", "Работа с несколькими сетями — это всегда три вопроса: какая сеть, какой токен, чем платить газ. Приватность законна, пока вы можете раскрыть данные тем, кому обязаны: бухгалтеру, банку, налоговой.": "Working with several networks always comes down to three questions: which network, which token, and what pays the gas. Privacy is legal as long as you can disclose your data to the people you owe it to: an accountant, a bank, the tax office.", "В РФ оплата товаров и услуг криптовалютой запрещена (259-ФЗ), поэтому сценарий разыгран в учебной юрисдикции. Доход в криптовалюте декларируется.": "In Russia, paying for goods and services in crypto is banned (Federal Law 259), so this scenario is set in a training jurisdiction. Crypto income must be declared.", "Недостаточно ETH для оплаты газа в сети Cube L2.": "Not enough ETH to pay the gas on Cube L2.", "Бот взял 20 USDC и пропал": "The bot took 20 USDC and disappeared", "«Помощник с газом» из чата просит прислать USDC вперёд. Газ так никто и не прислал. Газ берут с биржи (вывод прямо в нужную сеть) или через мост.": "A “gas helper” from the chat asks you to send USDC first. Nobody ever sends the gas. You get gas by withdrawing from an exchange straight to the right network, or through a bridge.", "Мост взломали": "The bridge was hacked", "Через сутки MegaBridge взломали, его mbUSDC подешевел до 0,18 $. Новый мост с бонусами — самый рискованный вариант: в нём копятся чужие деньги, а код не проверен временем. Отмотаем время.": "A day later MegaBridge was hacked, and its mbUSDC fell to $0.18. A new bridge with bonuses is the riskiest option: it accumulates other people's money, and its code hasn't been tested by time. Let's rewind time.", "Обёртка потеряла привязку": "The wrapper lost its peg", "bUSDC — расписка моста. Когда у моста проблемы, она торгуется с дисконтом, и выйти по 1 $ уже нельзя. Если у сети есть нативный USDC, берите его.": "bUSDC is a bridge IOU. When the bridge runs into trouble, it trades at a discount, and you can't get out at $1 anymore. If the network has a native USDC, take that.", "Биржа отклонила вывод: 0x… — не адрес сети Bitcoin.": "The exchange rejected the withdrawal: 0x… isn't a Bitcoin network address.", "Пётр получил BTCB в чужой сети": "Petr received BTCB on the wrong network", "Биржа отправила обёрнутый BTC в BNB Chain на адрес 0x. Bitcoin-кошелёк Петра его не видит, а ключей от этого адреса в другой сети у него может и не быть. Отмотаем время.": "The exchange sent wrapped BTC on BNB Chain to a 0x address. Petr's Bitcoin wallet can't see it, and he may not even have keys to that address on another network. Let's rewind time.", "Один адрес для всех": "One address for everyone", "Основной адрес работает, но если раздавать его всем, отправители смогут понять, что платят одному человеку. На каждого отправителя заводят отдельный субадрес.": "The main address works, but if you hand it out to everyone, senders can tell that they're paying the same person. Give each sender a separate subaddress.", "Магазин получил ключ траты": "The shop received the spend key", "Секретный ключ траты даёт полный контроль над кошельком. «Магазин» или любой, кто увидит переписку, заберёт все XMR.": "The secret spend key gives full control of the wallet. The “shop”, or anyone who reads the chat, will take all your XMR.", "Seed-фраза ушла в чат поддержки": "The seed phrase went to the support chat", "25 слов — это весь кошелёк. Для доказательства платежа они не нужны.": "The 25 words are the whole wallet. You don't need them to prove a payment.", "Платёж без назначения": "A payment without a reference", "Олег получает оплату от десятка клиентов. Без memo «Счёт №12» он не поймёт, кто заплатил, а у вас не будет записи для бухгалтерии. Memo в Zcash зашифрован и виден только получателю.": "Oleg gets payments from dozens of clients. Without the memo “Invoice No. 12” he can't tell who paid, and you won't have a record for the accountant. A memo in Zcash is encrypted and visible only to the recipient.", "Инна получила seed-фразу": "Inna got the seed phrase", "Инна получила ключ траты": "Inna got the spend key", "Бухгалтеру нужно видеть операции, а не распоряжаться деньгами. С этим ключом Инна, или любой, кто взломает её почту, может потратить все ZEC. Для отчётности есть ключ просмотра.": "An accountant needs to see transactions, not to control the money. With that key, Inna, or anyone who hacks her email, can spend all your ZEC. The viewing key is there for the paperwork.", "Зарплата фрилансера": "Freelancer's pay", "Ошибка стоила бы денег": "The mistake would have cost money", "Гонорар получен и учтён": "Payment received and recorded", "Оплата в нужной сети, газ есть, перевод в основную сеть надёжным мостом, а бухгалтер видит всё через ключ просмотра.": "The payment is on the right network, there's gas, the money moved to the main network through a reliable bridge, and the accountant sees everything through the viewing key.", "Клиент готов заплатить 500 USDC и спрашивает, куда. Он платит в сети Cube L2.": "The client is ready to pay 500 USDC and asks where. They pay on the Cube L2 network.", "Скинуть адрес 0x, он разберётся": "Send the 0x address, they'll figure it out", "Клиент отправил в BNB Chain, потому что там дешевле. Теперь деньги в сети, которую ваш кошелёк не видит.": "The client sent to BNB Chain because it's cheaper there. Now the money is on a network your wallet can't see.", "Дать адрес 0x и написать явно: сеть Cube L2, токен USDC": "Give the 0x address and say it explicitly: Cube L2 network, USDC token", "Адрес, сеть и токен — три вещи, которые надо назвать всегда.": "The address, the network and the token are three things you always have to state.", "Дать адрес Monero, так приватнее": "Give a Monero address, it's more private", "USDC в сети Cube L2 нельзя отправить на адрес Monero.": "USDC on Cube L2 can't be sent to a Monero address.", "Пришло 500 USDC, но ETH для газа в Cube L2 нет.": "500 USDC arrived, but there's no ETH for gas on Cube L2.", "Вывести немного ETH с биржи прямо в сеть Cube L2": "Withdraw a little ETH from the exchange straight to Cube L2", "Биржи выводят ETH сразу во вторые сети, без моста.": "Exchanges withdraw ETH directly to second networks, without a bridg
