<title>Cryptocube: шесть кубиков</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: wooden cube (map of faces) · simulated phone (the sandbox) · task card (what to do and why) */
:root {
  --bg: #e6ecea;          /* teal-grey velvet the cube sits on */
  --surface: #fbfcfb;
  --surface-2: #f1f4f2;
  --line: #cdd6d3;
  --wood: #dcbf98;        /* beech */
  --wood-edge: #c9a676;
  --burn: #2b1e14;        /* laser-burnt engraving */
  --fg: #1d2523;
  --muted: #5b6764;
  --accent: #1f6a64;
  --accent-soft: #d5e8e5;
  --on-accent: #ffffff;
  --ok: #2c7a47;
  --ok-soft: #dcefe2;
  --bad: #b0412c;
  --bad-soft: #f6e0da;
  --warn: #9a6a12;
  --phone: #141a19;
  --screen: #ffffff;
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Onest", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141c1c; --surface: #1c2626; --surface-2: #222e2e; --line: #33413f;
  --wood: #b8946a; --wood-edge: #9c7a52; --burn: #2a1b10;
  --fg: #e8eeec; --muted: #9aa8a5; --accent: #5fb5ac; --accent-soft: #1f3836; --on-accent: #0e1a19;
  --ok: #6cc28b; --ok-soft: #1d3527; --bad: #e88a73; --bad-soft: #3a221c; --warn: #e0b45a;
  --phone: #050707; --screen: #1a2222; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141c1c; --surface: #1c2626; --surface-2: #222e2e; --line: #33413f;
  --wood: #b8946a; --wood-edge: #9c7a52; --burn: #2a1b10;
  --fg: #e8eeec; --muted: #9aa8a5; --accent: #5fb5ac; --accent-soft: #1f3836; --on-accent: #0e1a19;
  --ok: #6cc28b; --ok-soft: #1d3527; --bad: #e88a73; --bad-soft: #3a221c; --warn: #e0b45a;
  --phone: #050707; --screen: #1a2222; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: 0.86em; word-break: break-all; }
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 20px; }

header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font: 700 22px/1.2 var(--font-display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.brand .sub { color: var(--muted); }
.meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-variant-numeric: tabular-nums; }
.pill.sandbox { border-color: var(--warn); color: var(--warn); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11px; }
.switch { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); flex-wrap: wrap; }
.tabbtn { border: 0; background: transparent; border-radius: 8px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.tabbtn.on { background: var(--fg); color: var(--bg); font-weight: 600; }
.tabbtn:disabled { opacity: 0.5; cursor: not-allowed; }
.ghost { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 6px 12px; font-size: 13px; }

.layout { display: grid; gap: 20px; grid-template-columns: 260px minmax(0, 380px) minmax(0, 1fr); align-items: start; }
@media (max-width: 1100px) { .layout { grid-template-columns: 240px minmax(0, 1fr); } .brief { grid-column: 1 / -1; } }
@media (max-width: 720px) { .layout { grid-template-columns: minmax(0, 1fr); } .cubecol { order: 0; } .brief { order: 1; } .phonecol { order: 2; } }

/* cube */
.cubecol { display: grid; gap: 16px; }
.scene { height: 210px; perspective: 700px; display: grid; place-items: center; }
.cube { width: 140px; height: 140px; position: relative; transform-style: preserve-3d; transition: transform 0.9s cubic-bezier(.2,.7,.2,1); }
@media (prefers-reduced-motion: reduce) { .cube { transition: none; } }
.face { position: absolute; inset: 0; background: var(--wood); border: 1px solid var(--wood-edge); border-radius: 6px;
  display: grid; place-items: center; align-content: center; gap: 6px; color: var(--burn); backface-visibility: hidden;
  background-image: repeating-linear-gradient(100deg, transparent 0 7px, rgba(90,60,30,0.07) 7px 8px); }
.face .n { width: 30px; height: 30px; border: 2px solid var(--burn); border-radius: 50%; display: grid; place-items: center; font: 700 15px var(--font-display); }
.face .t { font: 600 13px var(--font-body); text-align: center; padding: 0 8px; }
.face.lit { box-shadow: inset 0 0 0 3px var(--burn); }
.face.lit .n { background: var(--burn); color: var(--wood); }
.f1 { transform: translateZ(70px); } .f2 { transform: rotateY(90deg) translateZ(70px); } .f3 { transform: rotateY(180deg) translateZ(70px); }
.f4 { transform: rotateY(-90deg) translateZ(70px); } .f5 { transform: rotateX(90deg) translateZ(70px); } .f6 { transform: rotateX(-90deg) translateZ(70px); }
.facelist { display: grid; gap: 6px; list-style: none; margin: 0; padding: 0; }
.facelist button { width: 100%; text-align: left; display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; border: 1px solid transparent; background: transparent; }
.facelist button:hover:not(:disabled) { background: var(--surface); }
.facelist button.cur { background: var(--surface); border-color: var(--line); }
.facelist button:disabled { opacity: 0.45; cursor: not-allowed; }
.facelist .num { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--fg); display: grid; place-items: center; font: 600 12px var(--font-display); }
.facelist .done .num { background: var(--fg); color: var(--bg); }
.facelist .st { font-size: 12px; color: var(--muted); }

/* phone */
.phonecol { display: grid; justify-items: center; }
.phone { width: 100%; max-width: 360px; background: var(--phone); border-radius: 36px; padding: 12px; box-shadow: 0 18px 40px rgba(0,0,0,0.18); }
.screen { background: var(--screen); border-radius: 26px; height: 640px; position: relative; overflow: hidden; display: flex; flex-direction: column; }
.statusbar { display: flex; justify-content: space-between; padding: 10px 18px 4px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.appbar { padding: 6px 16px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.appbar h2 { font: 600 17px var(--font-body); margin: 0; }
.body { flex: 1; overflow-y: auto; padding: 4px 16px 16px; display: grid; align-content: start; gap: 12px; min-height: 0; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); }
.tabs button { background: none; border: 0; padding: 10px 4px 14px; font-size: 12px; color: var(--muted); position: relative; }
.tabs button.on { color: var(--accent); font-weight: 600; }
.tabs .dot { position: absolute; top: 6px; right: 28%; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
.watermark { position: absolute; inset: auto 0 64px; text-align: center; font: 700 11px var(--font-display); letter-spacing: 0.3em; color: var(--warn); opacity: 0.55; pointer-events: none; }

.btn { border: 0; border-radius: 12px; padding: 12px 14px; background: var(--accent); color: var(--on-accent); font-weight: 600; width: 100%; }
.btn.sec { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }
.btn.danger { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.row { display: flex; gap: 8px; } .row > * { flex: 1; min-width: 0; }
.card { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--surface); display: grid; gap: 6px; }
.muted { color: var(--muted); font-size: 13px; }
.big { font: 700 26px var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.asset { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.asset:last-child { border-bottom: 0; }
.coin { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 700 11px var(--font-display); background: var(--accent-soft); color: var(--accent); }
.coin.cube { background: var(--wood); color: var(--burn); }
.num { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); text-align: left; width: 100%; }
.app .icon { width: 48px; height: 48px; border-radius: 12px; background: var(--wood); display: grid; place-items: center; color: var(--burn); font: 700 18px var(--font-display); }
.ad { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; padding: 0 4px; }

.pinrow { display: flex; justify-content: center; gap: 12px; padding: 8px 0; }
.pinrow span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--fg); }
.pinrow span.f { background: var(--fg); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keypad button { padding: 14px 0; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font: 600 18px var(--font-body); }

.seedgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; counter-reset: w; padding: 12px; border: 1px dashed var(--warn); border-radius: 12px; }
.seedgrid div { font-family: var(--font-mono); font-size: 14px; }
.seedgrid div::before { counter-increment: w; content: counter(w) ". "; color: var(--muted); display: inline-block; width: 2.2em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-family: var(--font-mono); font-size: 13px; }
.chip.sel { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.choice { text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); width: 100%; }

.qr { display: grid; grid-template-columns: repeat(21, 1fr); width: 168px; aspect-ratio: 1; max-width: 100%; margin: 0 auto; padding: 8px; background: #fff; border-radius: 8px; }
.qr i { background: #fff; } .qr i.b { background: #111; }

.msg { max-width: 86%; padding: 8px 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
.msg.me { justify-self: end; background: var(--accent-soft); border-color: transparent; }
.msg .who { font-size: 11px; font-weight: 600; color: var(--muted); }
.msg.scam .who { color: var(--muted); }

.tx { display: grid; gap: 2px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-align: left; width: 100%; }
.status { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
.status.pending { color: var(--warn); } .status.ok { color: var(--ok); }
dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 13px; }
dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; min-width: 0; }

.block { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 4px; background: var(--surface); }
.block.broken { border-color: var(--bad); background: var(--bad-soft); }
.block input { font: inherit; width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--screen); color: var(--fg); }
.link { text-align: center; color: var(--muted); font-size: 18px; line-height: 1; }
.link.broken { color: var(--bad); }

.field { display: grid; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); }
.field input, .restore input { font: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--screen); color: var(--fg); width: 100%; }
.restore { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.restore input { font-family: var(--font-mono); font-size: 13px; padding: 8px; }
.fees { display: grid; gap: 6px; }
.fee { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--surface); }
.fee.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

.trap { position: absolute; inset: 0; background: rgba(10,12,12,0.55); display: grid; align-items: end; padding: 12px; z-index: 5; }
.trap .sheet { background: var(--screen); border-radius: 20px; padding: 16px; display: grid; gap: 10px; border-top: 4px solid var(--bad); }
.trap .tag { font: 700 11px var(--font-display); letter-spacing: 0.12em; color: var(--bad); text-transform: uppercase; }
.trap h3 { margin: 0; font-size: 17px; }

/* brief */
.brief { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
.eyebrow { font: 600 11px var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
.brief h2 { font: 700 20px/1.25 var(--font-display); margin: 4px 0 0; text-wrap: balance; }
.brief p { margin: 0; max-width: 62ch; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.steps li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; }
.steps .box { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--muted); margin-top: 2px; display: grid; place-items: center; font-size: 13px; }
.steps li.ok .box { background: var(--ok); border-color: var(--ok); color: #fff; }
.steps li.ok span:last-child { color: var(--muted); }
.explain { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.explain b { font-weight: 600; }
.quiz { display: grid; gap: 14px; }
.quiz fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 6px; }
.quiz legend { font-weight: 600; margin-bottom: 4px; }
.quiz .opt { text-align: left; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--surface-2); }
.quiz .opt.right { border-color: var(--ok); background: var(--ok-soft); }
.quiz .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.site { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.site .bar { background: var(--surface-2); padding: 6px 10px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
.site .in { padding: 12px; display: grid; gap: 6px; }
.paper { background: #fffdf6; color: #2a2a2a; border-radius: 4px; padding: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); transform: rotate(-0.6deg); }
.paper .seedgrid { border: 0; padding: 0; }
.paper .seedgrid div::before { color: #888; }
.done-banner { border: 2px solid var(--ok); border-radius: 14px; padding: 14px; display: grid; gap: 8px; background: var(--ok-soft); }
.final { display: grid; gap: 10px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stats div { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--surface-2); }
.stats b { display: block; font: 700 20px var(--font-display); font-variant-numeric: tabular-nums; }
.feed { display: grid; gap: 6px; font-size: 13px; }
.feed div { display: grid; grid-template-columns: auto 1fr; gap: 8px; color: var(--muted); }

/* справочник, подсказки, ИИ-помощник */
[hidden] { display: none !important; }
.term { border-bottom: 1.5px dotted var(--accent); cursor: help; }
.term:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 2px; }
#tip { position: fixed; z-index: 60; background: var(--fg); color: var(--bg); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; font-size: 13px; line-height: 1.45; box-shadow: 0 8px 24px rgba(0,0,0,0.2); pointer-events: none; }
#tip .tipmeta { opacity: 0.7; font-size: 11px; }
#helppanel { position: fixed; inset: 0; z-index: 40; background: rgba(10,12,12,0.45); display: flex; justify-content: flex-end; }
.hp-sheet { background: var(--surface); width: min(560px, 100%); height: 100%; display: flex; flex-direction: column; box-shadow: -8px 0 30px rgba(0,0,0,0.2); }
.hp-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 16px; border-bottom: 1px solid var(--line); }
.hp-body { overflow-y: auto; padding: 16px; display: grid; gap: 18px; align-content: start; }
.gsec { display: grid; gap: 8px; }
dl.gloss { margin: 0; display: grid; gap: 2px 0; }
dl.gloss dt { font-weight: 600; margin-top: 8px; }
dl.gloss dd { margin: 0; color: var(--muted); }
ul.lib { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
ul.lib li { display: grid; gap: 1px; }
ul.lib a { color: var(--accent); font-weight: 600; }
#aibtn { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 16px; z-index: 30; border: 0; border-radius: 999px; padding: 12px 18px; background: var(--accent); color: var(--on-accent); font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
#aibox { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 16px; z-index: 35; width: min(380px, calc(100vw - 32px)); height: min(560px, calc(100dvh - 32px)); background: var(--screen); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 12px 40px rgba(0,0,0,0.25); display: flex; flex-direction: column; overflow: hidden; }
.ai-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.ai-head .muted { font-size: 12px; }
.ai-log { flex: 1; overflow-y: auto; padding: 12px; display: grid; gap: 8px; align-content: start; min-height: 0; }
.ai-form { display: flex; gap: 6px; padding: 10px 12px 4px; border-top: 1px solid var(--line); }
.ai-form input { flex: 1; min-width: 0; font: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--surface); color: var(--fg); }
.ai-form .btn { width: auto; }
.ai-note { margin: 0; padding: 0 12px 10px; font-size: 11px; color: var(--muted); }
body { padding-bottom: 80px; }
</style>

<div class="wrap">

    <div class="brand">
      <h1 id="h1">Кубик 1 · Первый кошелёк</h1>

</div>

<div id="tip" role="tooltip" hidden></div>

<script>
(() => {
const WORDS = 'apple arrow badge beach blanket bridge cabin camera canal castle cherry clock cloud coast coral cotton cradle crystal desert dolphin dragon eagle echo engine fabric falcon feather fiber forest fossil galaxy garden giant ginger glacier globe harbor hazard hockey honey horizon island ivory jacket jungle kettle kingdom ladder lantern lemon liberty lizard lobster magnet marble meadow mirror monkey mountain museum napkin needle noodle ocean olive orbit oxygen paddle palace panda pepper piano pilot planet pocket pottery puzzle rabbit radar ribbon rocket saddle salmon scatter shadow silver sketch slogan spider spirit stadium sunset tackle timber tomato tornado tunnel turtle umbrella valley velvet violin volcano walnut wagon whisper window winter wizard yellow zebra'.split(' ');
const MASHA = '0x9A4e1c07B3d25F8e6C1a0D47b92E5f3C8d6A1b20';
const PETR = '0x5Fd27aC90e4B1d3386cE0f52A7b9D41e60c2F8a3';
const TOKEN_REAL = '0xC0BE51e2a9D04f7B3c6E8a1D95f20B7c4E3d6A19';
const TOKEN_FAKE = '0xC0BE51e2a9D04f7B3c6E8a1D95f20B7c4E3d6Al9';
const SUPPORT = '@CubeWallet_Help_24';

const FACES = [

const QUIZ = [
  { q: 'Что произойдёт, если кто-то изменит старую запись в своей копии блокчейна?', a: ['Изменение разойдётся по всей сети', 'Сеть отвергнет его копию: отпечатки блоков не сойдутся', 'Запись удалится через сутки'], r: 1 },
  { q: 'Кто хранит копии блокчейна?', a: ['Один банк', 'Компания, выпустившая монету', 'Тысячи независимых участников сети'], r: 2 },
  { q: 'Что связывает блоки в цепочку?', a: ['Каждый блок хранит хэш предыдущего', 'Номер телефона владельца', 'Пароль администратора'], r: 0 },
];

const BLOCKS0 = ['Маша → Пётр: 2 ETH', 'Пётр → Инна: 0,5 ETH', 'Инна → Маша: 1 ETH', 'Маша → Аня: 0,3 ETH'];

const hsh = s => { let x = 0x811c9dc5; for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 0x01000193) >>> 0; } return x.toString(16).padStart(8, '0'); };
const addrOf = seed => '0x' + [0, 1, 2, 3, 4].map(i => hsh(seed + '#' + i)).join('');
const txHash = s => '0x' + [0, 1, 2, 3, 4, 5, 6, 7].map(i => hsh(s + i)).join('');
const short = a => a.slice(0, 6) + '…' + a.slice(-4);
const fmt = n => (Math.round(n * 1e6) / 1e6).toLocaleString('ru-RU', { maximumFractionDigits: 6 });
const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return m > 10 && m < 20 ? c : k === 1 ? a : k > 1 && k < 5 ? b : c; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pick = (arr, k) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a.slice(0, k); };

function fresh() {
  return { face: 1, done: {}, st: {}, xp: 0, traps: 0, tab: 'home', view: null,
    f1: { blocks: BLOCKS0.slice(), quiz: {} },
    w: { app: false, pin: '', pin1: '', seed: [], written: false, confirm: null, confirmSel: {}, storage: null, addr: '' },
    bal: { me: { ETH: 0, CUBE: 0 }, masha: { ETH: 1.2 }, petr: { ETH: 0.3 } },
    tokens: ['ETH'], txs: [], chat: [], block: 19824510,
    f4: { tokenSearch: false }, f5: { amount: '0.05', fee: 'normal', review: false, feeAns: null, lastTx: null },
    f6: { stage: 'wiped', words: Array(12).fill(''), paper: false, scamFirst: Math.random() < 0.5, invoice: false, payTo: null },
    trap: null, snap: null };
}
let S;
try { S = JSON.parse(localStorage.getItem('cryptocube-1') || 'null'); } catch (e) { S = null; }
if (!S || !S.f6) S = fresh();
S.trap = null;
const save = () => { try { localStorage.setItem('cryptocube-1', JSON.stringify(S)); } catch (e) {} };

const stepDone = id => !!S.st[id];
function mark(id) {
  if (S.st[id]) return;
  S.st[id] = true; S.xp += 50;
  const f = FACES[S.face - 1];
  if (f.steps.every(([k]) => S.st[k]) && !S.done[f.n]) { S.done[f.n] = true; S.xp += 100; }
}
function trap(title, text, restore) {
  S.traps += 1;
  S.trap = { title, text, restore: !!restore };
}
function say(who, text, extra) { S.chat.push(Object.assign({ who, text }, extra || {})); }

const FEE = { slow: { label: 'Медленно', eta: '~10 мин', fee: 0.0016 }, normal: { label: 'Обычно', eta: '~30 сек', fee: 0.0042 }, fast: { label: 'Срочно', eta: '~12 сек', fee: 0.031 } };

function sendTx(from, to, amount, fee, asset, note) {
  const h = txHash(from + to + amount + Date.now() + Math.random());
  const tx = { hash: h, from, to, amount, fee, asset: asset || 'ETH', status: 'pending', block: null, note: note || '' };
  S.txs.unshift(tx);
  const who = k => k === S.w.addr ? 'me' : k === MASHA ? 'masha' : k === PETR ? 'petr' : null;
  const a = who(from), b = who(to);
  if (a) S.bal[a][tx.asset] = (S.bal[a][tx.asset] || 0) - amount - (tx.asset === 'ETH' ? fee : 0);
  if (a && tx.asset !== 'ETH') S.bal[a].ETH -= fee;
  setTimeout(() => {
    const t = S.txs.find(x => x.hash === h); if (!t) return;
    t.status = 'ok'; S.block += 1 + Math.floor(Math.random() * 3); t.block = S.block;
    if (b) S.bal[b][t.asset] = (S.bal[b][t.asset] || 0) + amount;
    onConfirmed(t); render();
  }, 2200);
  return tx;
}
function onConfirmed(t) {
  if (S.face === 4 && t.from === MASHA && t.to === S.w.addr) {
    mark('f4-recv');
    say('Маша', 'Отправила 0,1 ETH, проверь!');
    setTimeout(() => { say('Маша', 'Слушай, а пришли мне свои 12 слов? Я гляну, правильно ли у тебя всё настроено 🙂', { choice: 'seedask' }); render(); }, 1400);
  }
  if (S.face === 4 && t.asset === 'CUBE') say('Cube Project', 'Начислили 100 учебных CUBE за регистрацию.');
  if (t.from === S.w.addr && t.to === MASHA && S.face === 5) { mark('f5-send'); say('Маша', 'Пришло, спасибо!'); }
  if (t.from === S.w.addr && t.to === PETR && S.face === 6) { S.chat.forEach(m => { if (m.choice === 'invoice') m.choice = null; }); mark('f6-pay'); say('Пётр', 'Оплата получена, заказ отправляю.'); }
}

/* ---------- actions ---------- */
const A = {
  reset() { S = fresh(); },
  goface(n) { n = +n; if (n === 1 || S.done[n - 1]) { S.face = n; S.trap = null; S.view = null; enterFace(); } },
  next() { if (S.face < 6) { S.face += 1; S.view = null; enterFace(); } },
  closetrap() { const r = S.trap && S.trap.restore; S.trap = null; if (r && S.snap) { const keep = { xp: S.xp, traps: S.traps }; S = Object.assign(JSON.parse(S.snap), keep); S.snap = null; } },
  tab(t) { S.tab = t; S.view = null; },
  view(v) { S.view = v; },
  quiz(arg) { const [i, j] = arg.split(':').map(Number); S.f1.quiz[i] = j; if (QUIZ.every((q, k) => S.f1.quiz[k] === q.r)) mark('f1-quiz'); },
  tamper() { S.f1.blocks[1] = 'Пётр → Инна: 50 ETH'; mark('f1-tamper'); },
  untamper() { S.f1.blocks = BLOCKS0.slice(); },
  app(kind) {
    if (kind === 'fake') { trap('Это поддельное приложение', 'Разработчик «Cube Wallett Inc» (две t), 1 тыс. установок и пометка «Реклама». Такие копии крадут seed-фразу при первом же вводе. Ставьте кошелёк только по ссылке с официального сайта.'); return; }
    S.w.app = true;
    if (S.face === 2) mark('f2-app');
    if (S.face === 6) { mark('f6-app'); S.f6.stage = 'restore'; }
  },
  key(d) {
    if (S.view === 'pinerr') S.view = null;
    if (d === 'del') { if (S.w.pin1 && S.w.pin1.length === 6) S.w.pin = S.w.pin.slice(0, -1); else S.w.pin1 = S.w.pin1.slice(0, -1); return; }
    if (!S.w.pin1 || S.w.pin1.length < 6) { S.w.pin1 = (S.w.pin1 || '') + d; return; }
    S.w.pin += d;
    if (S.w.pin.length === 6) {
      if (S.w.pin !== S.w.pin1) { S.w.pin = ''; S.w.pin1 = ''; S.view = 'pinerr'; return; }
      S.w.seed = pick(WORDS, 12); S.w.addr = addrOf(S.w.seed.join(' '));
      mark('f2-pin'); S.view = null;
    }
  },
  seedbad(kind) {
    const t = kind === 'shot'
      ? ['Скриншот попал в облачную галерею', 'Фото синхронизируются с облаком, их видят приложения с доступом к галерее. Вредоносные программы специально ищут на снимках 12 английских слов.']
      : ['Облачная заметка — не хранилище для seed', 'Взломали почту или облако, и деньги ушли. Seed-фраза должна существовать только офлайн.'];
    trap(t[0], t[1]);
  },
  written() {
    S.w.written = true; mark('f3-write');
    const idx = pick([...Array(12).keys()], 3).sort((a, b) => a - b);
    S.w.confirm = idx.map(i => ({ i, opts: pick(pick(WORDS.filter(w => w !== S.w.seed[i]), 5).concat(S.w.seed[i]), 6) }));
    S.w.confirmSel = {};
  },
  csel(arg) { const [k, w] = arg.split(':'); S.w.confirmSel[k] = w; },
  confirm() {
    const ok = S.w.confirm.every((c, k) => S.w.confirmSel[k] === S.w.seed[c.i]);
    if (ok) mark('f3-confirm');
    else { S.view = 'confirmerr'; S.w.confirmSel = {}; }
  },
  store(kind) {
    if (kind === 'notes' || kind === 'photo') { trap(kind === 'notes' ? 'Заметки синхронизируются' : 'Галерея тоже синхронизируется', 'Всё, что лежит в телефоне, уходит в облако и в резервные копии. Seed-фраза должна существовать только на бумаге или металле.'); return; }
    S.w.storage = kind; mark('f3-store');
  },
  sendaddr() { if (stepDone('f4-addr')) return; mark('f4-addr'); say('Вы', 'Мой адрес: ' + S.w.addr, { me: true }); S.tab = 'chat'; S.view = null; setTimeout(() => { sendTx(MASHA, S.w.addr, 0.1, 0.0009, 'ETH'); render(); }, 900); },
  seedask(ans) {
    if (ans === 'give') { trap('Друга взломали', 'Аккаунт Маши угнали, и писал мошенник. Получив 12 слов, он вывел бы всё за минуту. Seed-фразу не просит никто: ни друзья, ни поддержка, ни «проверка настроек».'); return; }
    S.chat.forEach(m => { if (m.choice === 'seedask') m.choice = null; });
    say('Вы', 'Нет, seed-фразу никому не отправляю.', { me: true });
    say('Маша', 'Это была не я! Мой аккаунт угоняли, уже вернула. Молодец, что не прислал(а).');
    mark('f4-refuse');
  },
  tokensearch() { S.view = 'token'; },
  addtoken(kind) {
    if (kind === 'fake') { trap('Это токен-подделка', 'Название и тикер совпадают, а адрес контракта — нет (в конце «l9» вместо «19»). Такой токен ничего не стоит, а сайт, где его «покупают», крадёт деньги.'); return; }
    if (!S.tokens.includes('CUBE')) S.tokens.push('CUBE');
    S.view = null; mark('f4-token');
    sendTx(TOKEN_REAL, S.w.addr, 100, 0, 'CUBE');
  },
  sendform() { S.view = 'send'; S.f5.review = false; },
  fee(k) { S.f5.fee = k; },
  review() {
    const amt = parseFloat(String(S.f5.amount).replace(',', '.'));
    if (!(amt > 0)) { S.view = 'send'; S.f5.err = 'Введите сумму больше нуля'; return; }
    if (amt + FEE[S.f5.fee].fee > S.bal.me.ETH + 1e-9) { S.f5.err = 'Не хватает ETH на сумму и комиссию'; return; }
    S.f5.err = ''; S.f5.review = true;
  },
  confirmsend() {
    const to = S.f5.to || MASHA;
    const amt = parseFloat(String(S.f5.amount).replace(',', '.'));
    const fee = FEE[S.f5.fee].fee;
    if (S.f5.fee === 'fast') {
      S.snap = JSON.stringify(Object.assign({}, S, { trap: null }));
      sendTx(S.w.addr, to, amt, fee);
      trap('Комиссия дороже половины перевода', 'Вы отдали ' + fmt(fee) + ' ETH валидаторам за перевод ' + fmt(amt) + ' ETH. Перевод другу не горит: «Обычно» дошло бы за полминуты за ' + fmt(FEE.normal.fee) + ' ETH. Отмотаем время, попробуйте ещё раз.', true);
      return;
    }
    const tx = sendTx(S.w.addr, to, amt, fee);
    S.f5.lastTx = tx.hash; S.view = null; S.f5.review = false; S.f5.to = null; S.tab = 'home';
  },
  opentx(h) { S.view = 'tx:' + h; if (S.face === 5 && h === S.f5.lastTx) mark('f5-explorer'); },
  feeans(v) { S.f5.feeAns = v; const t = S.txs.find(x => x.hash === S.f5.lastTx); if (t && Math.abs(t.fee - +v) < 1e-9) mark('f5-fee'); },
  newphone() { S.f6.stage = 'store'; S.w.app = false; },
  paper() { S.f6.paper = true; },
  restore() {
    const ok = S.f6.words.map(w => w.trim().toLowerCase()).join(' ') === S.w.seed.join(' ');
    if (!ok) { S.view = 'restoreerr'; return; }
    mark('f6-restore'); S.f6.stage = 'home'; S.view = null;
    const scam = () => say('Поддержка Cube Wallet', 'Здравствуйте! После восстановления ваш кошелёк помечен как подозрительный. Пройдите верификацию: отправьте 12 слов в этот чат в течение 30 минут.', { choice: 'scam', scam: true });
    const inv = () => { say('Пётр', 'Счёт за заказ: 0,02 ETH. Адрес: ' + PETR, { choice: 'invoice' }); S.f6.invoice = true; };
    if (S.f6.scamFirst) { scam(); inv(); } else { inv(); scam(); }
  },
  scam(ans) {
    if (ans === 'give') { trap('Это мошенник', 'Настоящая поддержка не пишет первой и никогда не просит seed-фразу. Аккаунт ' + SUPPORT + ' создан вчера. Пожалуйтесь на него и не отвечайте.'); return; }
    S.chat.forEach(m => { if (m.choice === 'scam') m.choice = null; });
    say('Вы', 'Заблокировать и пожаловаться', { me: true }); mark('f6-scam');
  },
  invoice() { S.view = 'send'; S.f5.to = PETR; S.f5.amount = '0.02'; S.f5.fee = 'normal'; S.f5.review = false; S.tab = 'home'; },
};

function enterFace() {
  S.tab = 'home';
  if (S.face === 4 && !S.chat.length) say('Маша', 'Привет! Хочу скинуть тебе 0,1 ETH на первый кошелёк. Пришли адрес.');
  if (S.face === 5 && !S.chat.some(m => m.f5)) say('Маша', 'Вернёшь 0,05 ETH, когда сможешь? Не срочно.', { f5: true });
  if (S.face === 6 && S.f6.stage === 'wiped' && !stepDone('f6-app')) { S.w.app = false; }
}

/* ---------- render ---------- */
const $ = id => document.getElementById(id);
const ROT = { 1: 'rotateX(-14deg) rotateY(20deg)', 2: 'rotateX(-14deg) rotateY(-70deg)', 3: 'rotateX(-14deg) rotateY(-160deg)', 4: 'rotateX(-14deg) rotateY(110deg)', 5: 'rotateX(-80deg) rotateY(20deg)', 6: 'rotateX(76deg) rotateY(20deg)' };

function renderCube() {
  $('cube').style.transform = ROT[S.face];
  $('cube').innerHTML = FACES.map(f => `<div class="face f${f.n} ${S.done[f.n] ? 'lit' : ''}"><span class="n">${f.n}</span><span class="t">${f.short}</span></div>`).join('');
  $('facelist').innerHTML = FACES.map(f => {
    const open = f.n === 1 || S.done[f.n - 1];
    const st = S.done[f.n] ? 'пройдена' : f.n === S.face ? 'сейчас' : open ? 'открыта' : 'закрыта';
    return `<li><button class="${S.done[f.n] ? 'done' : ''} ${f.n === S.face ? 'cur' : ''}" data-act="goface" data-arg="${f.n}" ${open ? '' : 'disabled'}><span class="num">${f.n}</span><span>${f.short}</span><span class="st">${st}</span></button></li>`;
  }).join('');
  $('xp').textContent = S.xp + ' XP';
}

const bar = (title, right) => `<div class="statusbar"><span>9:41</span><span>Песочница · Ethereum</span></div><div class="appbar"><h2>${title}</h2>${right || ''}</div>`;
const tabs = () => {
  const unread = S.chat.some(m => m.choice && !(m.choice === 'invoice' && stepDone('f6-pay')));
  return `<nav class="tabs"><button class="${S.tab === 'home' ? 'on' : ''}" data-act="tab" data-arg="home">Кошелёк</button><button class="${S.tab === 'chat' ? 'on' : ''}" data-act="tab" data-arg="chat">Сообщения${unread && S.tab !== 'chat' ? '<span class="dot"></span>' : ''}</button><button class="${S.tab === 'explorer' ? 'on' : ''}" data-act="tab" data-arg="explorer">Обозреватель</button></nav>`;
};

function storeView() {

function qr(a) {
  let bits = ''; for (let i = 0; i < 14; i++) bits += parseInt(hsh(a + i), 16).toString(2).padStart(32, '0');
  let out = '';
  for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) {
    const finder = (x < 7 && y < 7) || (x > 13 && y < 7) || (x < 7 && y > 13);
    let b;
    if (finder) { const fx = x > 13 ? x - 14 : x, fy = y > 13 ? y - 14 : y; b = fx === 0 || fx === 6 || fy === 0 || fy === 6 || (fx > 1 && fx < 5 && fy > 1 && fy < 5); }
    else b = bits[y * 21 + x] === '1';
    out += `<i class="${b ? 'b' : ''}"></i>`;
  }
  return out;
}

function mark2(id) {
  if (T.st[id]) return;

  const f = FACES2[T.face - 1];
  if (f.steps.every(([k]) => T.st[k]) && !T.done[f.n]) { T.done[f.n] = true; T.xp += 100; }
}
function trap2(title, text, restore) { T.traps += 1; T.trap = { title, text, restore: !!restore }; }
const snap2 = () => { T.snap = JSON.stringify(Object.assign({}, T, { trap: null, snap: null })); };

const A2 = {
  reset() { T = fresh2(); },

  next() { if (T.face < 6) { T.face += 1; T.view = null; } },
  closetrap() { const r = T.trap && T.trap.restore; T.trap = null; if (r && T.snap) { const keep = { xp: T.xp, traps: T.traps }; T = Object.assign(JSON.parse(T.snap), keep); T.snap = null; } },

  next() { if (U.face < 6) { U.face += 1; U.view = null; } },
  closetrap() { const r = U.trap && U.trap.restore; U.trap = null; if (r && U.snap) { const keep = { xp: U.xp, traps: U.traps, st: U.st, done: U.done }; U = Object.assign(JSON.parse(U.snap), keep); U.snap = null; } },
  view(v) { U.view = v || null; },

/* --- подсказки: оборачиваем первое упоминание каждого термина --- */
function annotate(root) {
  if (!root) return;
  const used = new Set(); let budget = 14;
  const walk = node => {
    for (const ch of Array.from(node.childNodes)) {
      if (budget <= 0) return;
      if (ch.nodeType === 1) { if (!/^(BUTTON|INPUT|TEXTAREA|A|H2|H3|SCRIPT)$/.test(ch.tagName) && !ch.classList.contains('term') && !ch.classList.contains('mono')) walk(ch); continue; }
      if (ch.nodeType !== 3 || ch.nodeValue.trim().length < 3) continue;
      let best = null;
      for (const g of GL) { if (used.has(g.t)) continue; const m = g.re.exec(ch.nodeValue); if (m && (!best || m.index < best.m.index)) best = { g, m }; }
      if (!best) continue;
      const { g, m } = best; used.add(g.t); budget -= 1;
      const after = ch.splitText(m.index); after.splitText(m[1].length);
      const span = document.createElement('span');
      span.className = 'term'; span.tabIndex = 0; span.dataset.term = g.t; span.textContent = after.nodeValue;
      span.setAttribute('aria-describedby', 'tip');
      after.replaceWith(span);
      walk(node); return;
    }
  };
  walk(root);
}
const tipEl = () => document.getElementById('tip');
function showTip(el) {
  const g = GL.find(x => x.t === el.dataset.term); if (!g) return;
  const t = tipEl(); t.innerHTML = `<b>${esc(g.t)}</b><span>${esc(g.d)}</span><span class="tipmeta">Кубик ${g.c} · подробнее в словаре</span>`;
  t.hidden = false;
  const r = el.getBoundingClientRect(); const w = Math.min(300, window.innerWidth - 24);
  t.style.width = w + 'px';
  const left = Math.max(12, Math.min(r.left + r.width / 2 - w / 2, window.innerWidth - w - 12));
  t.style.left = left + 'px';
  const h = t.offsetHeight; const above = r.top - h - 8;
  t.style.top = (above > 8 ? above : r.bottom + 8) + 'px';
}
const hideTip = () => { const t = tipEl(); if (t) t.hidden = true; };

function ctxNow() {

  if (cube === 'c1') { face = S.face; f = FACES[face - 1]; } else if (cube === 'c2') { face = T.face; f = FACES2[face - 1]; } else { face = CUBES[cube].S.face; f = CUBES[cube].faces[face - 1]; }

function offlineAnswer(q) {
  const hits = GL.filter(g => g.re.test(q) || q.toLowerCase().includes(g.t.toLowerCase())).slice(0, 3);
  const c = ctxNow();
  if (/грань|задани|что делать|подскаж|помоги|не понимаю/i.test(q) || !hits.length) {
    return (hits.length ? hits.map(g => `${g.t}: ${g.d}`).join('\n\n') + '\n\n' : '') + `Сейчас вы на грани ${c.face}. Цель: ${c.goal}\n\nПодсказка: ${c.explain}`;
  }
  return hits.map(g => `${g.t}: ${g.d}`).join('\n\n');
}

      const r = await fetch('/api/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: ctl.signal,
        body: JSON.stringify({ messages: H.msgs.slice(-8), context: ctxNow() }) });
      clearTimeout(tm);
      const j = await r.json().catch(() => ({}));
      if (r.ok && j.answer) { answer = j.answer; H.mode = 'ai'; }
      else if (r.status === 429) answer = 'Слишком много вопросов подряд. Подождите пару минут.';
      else if (r.status === 404 || r.status === 501 || r.status === 405) H.mode = 'offline';
    } catch (e) { /* сеть недоступна: офлайн-ответ */ }
  }
  if (!answer) answer = offlineAnswer(q) + (H.mode === 'offline' ? '' : '\n\n(ИИ сейчас недоступен, ответ из словаря.)');

  if (CUBES[CUR]) { const c = CUBES[CUR]; U = c.S; const fn = GA[act] || c.A[act]; if (fn) { fn(b.dataset.arg, b); c.S = U; render(); } return; }
  if (CUR === 'c2') { if (A2[act]) { A2[act](b.dataset.arg, b); render(); } return; }
  if (act === 'copy') { try { navigator.clipboard.writeText(S.w.addr).then(() => { b.textContent = 'Скопировано'; }, () => { b.textContent = 'Выделите адрес вручную'; }); } catch (err) { b.textContent = 'Выделите адрес вручную'; } return; }
  if (act === 'view') { S.view = b.dataset.arg || null; render(); return; }
  if (A[act]) { A[act](b.dataset.arg, b); render(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (CUBES[CUR] && t.dataset.k) { U = CUBES[CUR].S; U.inp[t.dataset.k] = t.value; try { localStorage.setItem('cryptocube-' + CUBES[CUR].n, JSON.stringify(U)); } catch (err) {} return; }
  if (t.dataset.inp === 'rw') S.f6.words[+t.dataset.i] = t.value;
  if (t.dataset.inp === 'amt') S.f5.amount = t.value;
  save();
});

// resume any pending transactions after reload
S.txs.forEach(t => { if (t.status === 'pending') {
  t.status = 'ok'; S.block += 1; t.block = S.block;
  const b = t.to === S.w.addr ? 'me' : t.to === MASHA ? 'masha' : t.to === PETR ? 'petr' : null;
  if (b) S.bal[b][t.asset] = (S.bal[b][t.asset] || 0) + t.amount;
  onConfirmed(t);
} });
if (S.face === 4 && !S.chat.length) enterFace();
render();
})();
