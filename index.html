e.", "Спросить в чате, кто пришлёт газ за USDC": "Ask in the chat who will send gas for USDC", "В личку сразу напишет «помощник», возьмёт USDC и пропадёт.": "The “helper” will message you in private right away, take the USDC and vanish.", "Часть гонорара нужна в основной сети Ethereum.": "Part of the fee is needed on the main Ethereum network.", "Новый мост: 0% комиссии и бонус 20%": "New bridge: 0% fee and a 20% bonus", "Мосты с бонусами и без истории — любимая цель взломщиков.": "Bridges with bonuses and no track record are the favourite target of attackers.", "Официальный мост сети или проверенный агрегатор": "The network's official bridge or a proven aggregator", "Дольше или дороже, но надёжнее.": "Slower or more expensive, but safer.", "Вы не хотите, чтобы сумма гонорара была видна всем в блокчейне, но всё должно быть законно.": "You don't want the amount of your fee visible to everyone on the blockchain, but everything has to be legal.", "Прогнать через миксер": "Run it through a mixer", "Миксеры попадают под санкции, а деньги после них блокируют биржи и банки.": "Mixers get sanctioned, and after them exchanges and banks block the money.", "Держать в экранированном Zcash и дать бухгалтеру ключ просмотра": "Keep it in shielded Zcash and give the accountant the viewing key", "Приватность для всех, прозрачность для тех, кому вы обязаны отчитаться.": "Private for everyone, transparent to those you're accountable to.", "Конец года. Налоговая отчётность.": "Year end. Tax reporting.", "Выгрузить историю операций и передать бухгалтеру ключи просмотра": "Export the transaction history and pass the viewing keys to the accountant", "Доход в криптовалюте декларируется так же, как любой другой.": "Crypto income is declared the same way as any other income.", "Не декларировать: блокчейн анонимный": "Don't declare it: the blockchain is anonymous", "Блокчейн публичен, а биржи передают данные налоговым органам. Неуплата налога — нарушение закона.": "The blockchain is public, and exchanges pass data to the tax authorities. Not paying tax is a violation of the law.", "Кошелёк · Cube L2": "Wallet · Cube L2", "Маша получила 50 USDC": "Masha received 50 USDC", "Комиссия 0,000004 ETH, около 1 цента. В основной сети Ethereum такой перевод стоил бы около 1,5 $.": "Fee 0.000004 ETH, about one cent. On the main Ethereum network a transfer like this would have cost about $1.50.", "Где взять ETH для газа в Cube L2?": "Where to get ETH for gas on Cube L2?", "«Пришлите 20 USDC, верну ETH за минуту»": "“Send 20 USDC and I'll return ETH within a minute”", "Вывести 0,01 ETH с биржи CubeX": "Withdraw 0.01 ETH from the CubeX exchange", "Сеть вывода: Cube L2": "Withdrawal network: Cube L2", "Мост: Ethereum → Cube L2": "Bridge: Ethereum → Cube L2", "Официальный мост Cube L2": "Cube L2 official bridge", "~15 минут туда, вывод обратно 7 дней · выпускает нативный USDC": "~15 minutes there, withdrawing back takes 7 days · issues native USDC", "Агрегатор CubeRoute": "CubeRoute aggregator", "~2 минуты · работает 3 года · 2 аудита": "~2 minutes · running for 3 years · 2 audits", "0% + бонус 20%": "0% + 20% bonus", "Запущен на прошлой неделе": "Launched last week", "Мост: что получить?": "Bridge: what do you receive?", "Мост выбран": "Bridge chosen", "На Cube L2 пришло 300 USDC": "300 USDC arrived on Cube L2", "Нативный выпуск, обёрток нет": "Native issue, no wrappers", "Какой токен получить в Cube L2?": "Which token do you want on Cube L2?", "Обёртка моста · дешевле на 0,3%": "Bridge wrapper · 0.3% cheaper", "Нативный выпуск эмитента в сети Cube L2": "The issuer's native USDC on Cube L2", "Чей это адрес?": "Whose address is this?", "CubeX · вывод BTC": "CubeX · BTC withdrawal", "Пётр получил 0,001 BTC": "Petr received 0.001 BTC", "Сеть Bitcoin, адрес bc1…": "Bitcoin network, bc1… address", "<div class=\"msg me\"><div>Это 0x, а нужен адрес Bitcoin</div></div><div class=\"msg\"><div class=\"who\">Пётр</div><div>Ой, точно, скинул правильный.</div></div>": "<div class=\"msg me\"><div>That's a 0x address, I need a Bitcoin address</div></div><div class=\"msg\"><div class=\"who\">Petr</div><div>Oops, right, I sent the wrong one.</div></div>", "<button class=\"btn\" data-act=\"btc\" data-arg=\"send\">Вывести 0,001 BTC в сети Bitcoin</button>": "<button class=\"btn\" data-act=\"btc\" data-arg=\"send\">Withdraw 0.001 BTC on the Bitcoin network</button>", "Сеть Bitcoin": "Bitcoin network", "Спросить у Петра адрес Bitcoin": "Ask Petr for his Bitcoin address", "Пришли 0,001 BTC, вот мой адрес:": "Send 0.001 BTC, here's my address:", "заблокировано": "locked", "доступно": "available", "Seed-фраза: 25 слов · записана": "Seed phrase: 25 words · recorded", "Аня": "Anya", "Верну тебе 0,5 XMR за билеты. Куда?": "I'll send you 0.5 XMR for the tickets. Where to?", "Основной адрес": "Main address", "Новый субадрес с меткой «Аня»": "New subaddress labelled “Anya”", "Входящий ·": "Incoming ·", "из 10 подтверждений": "of 10 confirmations", "+0,5 XMR от «Аня»": "+0.5 XMR from “Anya”", "Монеты можно тратить после 10 блоков, примерно через 20 минут.": "The coins can be spent after 10 blocks, about 20 minutes.", "Оплатить худи (заблокировано)": "Pay for the hoodie (locked)", "Подождать 4 минуты": "Wait 4 minutes", "Cube Merch · худи «Кубик»": "Cube Merch · “Cube” hoodie", "Оплатить 0,2 XMR": "Pay 0.2 XMR", "Cube Merch · поддержка": "Cube Merch · support", "Не видим оплату по заказу №318. Пришлите, пожалуйста, подтверждение.": "We can't see the payment for order No. 318. Please send the confirmation.", "Ключ транзакции (tx key) и её хеш": "Transaction key (tx key) and its hash", "Секретный ключ траты": "Secret spend key", "Seed-фразу из 25 слов": "The 25-word seed phrase", "Оплата подтверждена": "Payment confirmed", "Магазин проверил ключ транзакции: он показывает только этот платёж, и тратить с ним нельзя.": "The shop checked the transaction key: it shows only this payment, and it can't be used to spend anything.", "ZEC прозрачные": "ZEC transparent", "ZEC экранированные": "ZEC shielded", "видны только вам": "visible only to you", "Прозрачный адрес: суммы и история видны всем, как в Bitcoin.": "A transparent address: amounts and history are visible to everyone, like Bitcoin.", "Экранировать 3 ZEC": "Shield 3 ZEC", "Оплата счёта": "Invoice payment", "✓ Memo: «Счёт №12, логотип»": "✓ Memo: “Invoice No. 12, logo”", "Олег, дизайнер · счёт №12": "Oleg, designer · invoice No. 12", "Отправить 1 ZEC": "Send 1 ZEC", "Инна, бухгалтер": "Inna, accountant", "Пришлите доступ к кошельку, чтобы я свела доходы и расходы за квартал.": "Send me access to the wallet so I can reconcile income and expenses for the quarter.", "Seed-фразу": "Seed phrase", "Ключ траты (spending key)": "Spending key", "Ключ просмотра (viewing key)": "Viewing key", "Инна видит отчёт": "Inna sees the report", "Ключ просмотра показывает входящие, исходящие и memo, но не позволяет тратить.": "The viewing key shows incoming and outgoing transactions and memos, but can't spend.", "Обеспечен долларами и облигациями в банке, ежемесячный отчёт аудитора": "Backed by dollars and bank bonds, with a monthly auditor's report", "Выпускается смарт-контрактом под криптозалог с запасом 150%": "Issued by a smart contract against crypto collateral, with 150% overcollateralisation", "Держится на сжигании токена LUNAcube, залога нет, платит 20% годовых": "Held up by burning the LUNAcube token, no collateral, pays 20% APY", "Фиатный резерв": "Fiat reserve", "Криптозалог": "Crypto-collateralised", "Алгоритм без залога": "Algorithmic, no collateral", "6 «Смарт-контракты и финал»": "6 “Smart contracts and the finale”", "Вы выбираете валидатора по истории, а не по нулевой комиссии, не продаёте ликвидный стейкинг в панике, держите запас по health factor, считаете непостоянные потери и отличаете обеспеченный стейблкоин от алгоритмического.": "You choose a validator by its track record, not by a zero fee; you don't sell liquid staking in a panic; you keep a margin on the health factor; you calculate impermanent loss; and you tell a backed stablecoin from an algorithmic one.", "Машина времени": "Time machine", "Стейкинг": "Staking", "Стейкинг и выбор валидатора": "Staking and choosing a validator", "Застейкайте 1 000 CUBE в сети CubeChain и получите первую награду.": "Stake 1,000 CUBE on the CubeChain network and receive your first reward.", "Выбрать надёжного валидатора": "Choose a reliable validator", "Получить награду за эпоху": "Collect the reward for the epoch", "В сетях с доказательством доли валидаторы подтверждают блоки под залог. За ошибки и мошенничество сеть сжигает часть залога (слэшинг), и делегаторы теряют вместе с валидатором. Нулевая комиссия не компенсирует плохую историю.": "In proof-of-stake networks, validators confirm blocks against collateral. For mistakes and fraud the network burns part of the collateral (slashing), and delegators lose along with the validator. A zero fee doesn't make up for a bad track record.", "Ликвидный стейкинг": "Liquid staking", "Ликвидный стейкинг и дисконт": "Liquid staking and the discount", "Внесите 1 ETH в протокол ликвидного стейкинга, а через неделю верните ETH без потерь.": "Put 1 ETH into a liquid staking protocol, and a week later get your ETH back without losses.", "Получить lsETH за 1 ETH": "Get lsETH for 1 ETH", "Вывести через очередь, а не продавать с дисконтом": "Exit through the withdrawal queue rather than selling at a discount", "Ликвидный стейкинг выдаёт токен-расписку (lsETH), который можно передавать и продавать. Его цена на рынке может уходить ниже ETH, особенно в панику. Протокол погашает его 1:1 через очередь вывода, но это занимает дни.": "Liquid staking issues a receipt token (lsETH) that you can transfer and sell. Its market price can drop below ETH, especially in a panic. The protocol redeems it 1:1 through the withdrawal queue, but that takes days.", "Кредитование": "Lending", "Заём под залог и health factor": "A collateralised loan and the health factor", "Займите USDC под 2 ETH так, чтобы пережить падение ETH на 30%.": "Borrow USDC against 2 ETH so you survive a 30% fall in ETH.", "Занять с health factor выше 1,5": "Borrow with a health factor above 1.5", "Пережить падение ETH на 30% без ликвидации": "Survive a 30% fall in ETH without liquidation", "Health factor = залог × порог ликвидации ÷ долг. Здесь порог 80%. Когда HF опускается ниже 1, любой может погасить часть вашего долга и забрать залог со скидкой. Запас по HF — ваша подушка на случай падения цены.": "Health factor = collateral × liquidation threshold ÷ debt. Here the threshold is 80%. When HF drops below 1, anyone can repay part of your debt and seize your collateral at a discount. Your HF margin is your cushion against a price fall.", "Пулы и фарминг": "Pools and farming", "Пул ликвидности и непостоянные потери": "Liquidity pool and impermanent loss", "Внесите ETH и USDC в пул, разберитесь с непостоянными потерями и выберите фарм.": "Deposit ETH and USDC into a pool, understand impermanent loss and choose a farm.", "Посчитать непостоянные потери": "Calculate the impermanent loss", "Выбрать проверенный фарм": "Choose a verified farm", "Пул держит две монеты в пропорции по стоимости. Когда цена одной растёт, пул продаёт её по пути, и вы получаете меньше, чем если бы просто держали. При росте в 2 раза это около 5,7%. Комиссии могут это перекрыть, а 3 000% годовых у анонимов обычно означают, что деньги заберут.": "A pool holds two coins in equal value. When one coin's price rises, the pool sells it along the way, and you get less than if you had simply held. If the price doubles, that's about 5.7%. Fees can offset this, but 3,000% APY from anonymous teams usually means the money gets taken.", "Стейблкоины": "Stablecoins", "Чем обеспечены стейблкоины": "What backs stablecoins", "Разберитесь, что стоит за тремя стейблкоинами, и разместите 1 000 $.": "Find out what stands behind three stablecoins and place $1,000.", "Определить тип обеспечения": "Determine the type of backing", "Разместить без алгоритмического стейблкоина": "Place it without the algorithmic stablecoin", "Фиатный стейблкоин держится на резервах в банке и доверии к эмитенту. Криптозалоговый — на избыточном залоге в смарт-контракте. Алгоритмический без залога держится только на вере рынка, и при панике цена уходит к нулю. Высокая доходность — плата за этот риск.": "A fiat stablecoin is held up by bank reserves and trust in the issuer. A crypto-collateralised one relies on excess collateral in a smart contract. An algorithmic one with no collateral holds up only on market belief, and in a panic its price goes to zero. The high yield is the price of that risk.", "Экзамен «Шторм»": "Exam “Storm”", "Проведите портфель через месяц штормового рынка. Машина времени отмотает неделю, если вы ошибётесь.": "Take the portfolio through a month of stormy markets. The time machine rewinds a week if you make a mistake.", "Пережить шторм без потерь": "Get through the storm without losses", "Шторм проверяет всё сразу: запас по заёму, терпение с ликвидным стейкингом, умение пройти мимо обещаний сверхдоходности и привычку проверять первоисточник.": "The storm tests everything at once: the margin on your loan, patience with liquid staking, the ability to walk past promises of extreme yields, and the habit of checking the primary source.", "Это учебная модель, а не инвестиционная рекомендация.": "This is a training model, not investment advice.", "Слэшинг": "Slashing", "MaxYield подписал два разных блока на одной высоте. Сеть сожгла 5% всех ставок у этого валидатора, включая ваши 50 CUBE. Нулевая комиссия не стоила потерь. Отмотаем время.": "MaxYield signed two different blocks at the same height. The network burned 5% of all stakes with this validator, including your 50 CUBE. The zero fee didn't make up for the loss. Let's rewind time.", "Продали с дисконтом 8%": "Sold at an 8% discount", "В панику lsETH на DEX стоил 0,92 ETH. Через очередь протокол вернул бы 1 ETH за 5 дней, а деньги были нужны только через неделю. Отмотаем время.": "In the panic, lsETH on the DEX was worth 0.92 ETH. Through the queue the protocol would have returned 1 ETH in 5 days, and you only needed the money in a week. Let's rewind time.", "Ликвидация": "Liquidation", "HF упал до": "HF fell to", ". Ликвидатор погасил часть долга и забрал ваш ETH со скидкой 5%. Отмотаем время к моменту до займа.": ". A liquidator repaid part of the debt and took your ETH at a 5% discount. Let's rewind time to just before the loan.", "Через три дня анонимная команда MoonFarm вывела все деньги из контракта через скрытую функцию. 3 000% годовых платились из депозитов новых участников. Отмотаем время.": "Three days later the anonymous MoonFarm team drained the contract through a hidden function. The 3,000% APY was paid out of new participants' deposits. Let's rewind time.", "Депег: TerraCube стоит 0,04 $": "Depeg: TerraCube is worth $0.04", "Крупный держатель продал, цена ушла ниже 1 $, механизм сжигания напечатал горы LUNAcube, и за два дня оба токена обесценились. 20% годовых были платой за этот риск. Отмотаем время.": "A large holder sold, the price fell below $1, the burn mechanism printed mountains of LUNAcube, and within two days both tokens lost their value. The 20% APY was the price of that risk. Let's rewind time.", "Шторм": "Storm", "Машина времени: отматываем неделю": "Time machine: rewinding a week", "Портфель пережил шторм": "The portfolio survived the storm", "Ни одной ликвидации, ни одной продажи в панику, ни одного рагпула.": "No liquidations, no panic sales, no rug pulls.", "Неделя 1. ETH упал на 25%. HF вашего займа опустился с 1,9 до 1,4.": "Week 1. ETH fell 25%. The health factor on your loan dropped from 1.9 to 1.4.", "Довнести залог или погасить часть долга": "Top up the collateral or repay part of the debt", "HF снова выше 1,8, следующее падение вас не ликвидирует.": "HF is back above 1.8, so the next fall won't liquidate you.", "Занять ещё и докупить ETH на просадке": "Borrow more and buy ETH on the dip", "HF упал до 1,05. Ещё −5%, и залог ушёл ликвидатору.": "HF fell to 1.05. Another −5%, and the collateral goes to the liquidator.", "Неделя 2. lsETH на DEX стоит 0,93 ETH. Деньги вам не нужны ближайший месяц.": "Week 2. lsETH on the DEX is worth 0.93 ETH. You won't need the money for a month.", "Продать всё на DEX, пока не стало хуже": "Sell everything on the DEX before it gets worse", "Вы зафиксировали минус 7%, хотя протокол погасил бы lsETH 1:1.": "You locked in a 7% loss, although the protocol would redeem lsETH 1:1.", "Не продавать в панику; если нужен ETH, выйти через очередь вывода": "Don't sell in a panic; if you need ETH, exit through the withdrawal queue", "Дисконт на рынке — не потеря, пока вы не продали.": "A market discount isn't a loss until you sell.", "Неделя 3. В чате: «Новый фарм, 5 000% годовых, закрываем через 2 часа!»": "Week 3. In the chat: “New farm, 5,000% APY, closing in 2 hours!”", "Зайти на 10% портфеля, вдруг повезёт": "Put in 10% of the portfolio, maybe you'll get lucky", "Через сутки фарм закрылся вместе с депозитами.": "A day later the farm closed along with the deposits.", "Пройти мимо: команда анонимная, контракт не проверен": "Walk past it: the team is anonymous and the contract isn't audited", "Срочность и нереальная доходность — два признака ловушки.": "Urgency and unrealistic yields are two signs of a trap.", "Неделя 4. USDCube на сутки подешевел до 0,88 $ из-за проблем банка, где хранится часть резервов.": "Week 4. USDCube fell to $0.88 for a day because of problems at a bank holding part of its reserves.", "Проверить отчёт о резервах и заявление эмитента, а не слухи": "Check the reserve report and the issuer's statement, not rumours", "Резервы оказались целы, через три дня цена вернулась к 1 $.": "The reserves were intact, and within three days the price was back at $1.", "Срочно переложить всё в TerraCube, он «держится»": "Move everything into TerraCube urgently, it's “holding”", "Через неделю TerraCube потерял привязку окончательно.": "A week later TerraCube lost its peg for good.", "в стейкинге": "in staking", "на кошельке": "in wallet", "Стейкинг CUBE": "CUBE staking", "Кому делегировать 1 000 CUBE?": "Who do you delegate 1,000 CUBE to?", "Берёзка": "Birch", "комиссия 5% · аптайм 99,9% · 4 года без штрафов": "5% fee · 99.9% uptime · 4 years without penalties", "0% комиссии": "0% fee", "аптайм 71% · штраф за двойную подпись в мае": "71% uptime · penalty for a double signature in May", "Дуб": "Oak", "комиссия 7% · аптайм 99,7% · 3 года без штрафов": "7% fee · 99.7% uptime · 3 years without penalties", "Награда получена: +2,4 CUBE": "Reward received: +2.4 CUBE", "Около 3,5% годовых за вычетом комиссии валидатора.": "About 3.5% APY after the validator's fee.", "<button class=\"btn\" data-act=\"claim\">Забрать 2,4 CUBE</button>": "<button class=\"btn\" data-act=\"claim\">Claim 2.4 CUBE</button>", "<button class=\"btn\" data-act=\"epoch\">Подождать эпоху</button>": "<button class=\"btn\" data-act=\"epoch\">Wait for the epoch</button>", "Валидатор": "Validator", "Награда начисляется раз в эпоху (около 6 часов).": "The reward is paid once per epoch (about 6 hours).", "Эпох прошло:": "Epochs passed:", "расписка за ETH в стейкинге": "receipt for ETH in staking", "Внесите ETH, получите lsETH 1:1. Награды копятся в курсе lsETH.": "Deposit ETH and get lsETH 1:1. Rewards accrue in the lsETH rate.", "Внести 1 ETH": "Deposit 1 ETH", "Напоминание": "Reminder", "Через неделю нужен 1 ETH: оплата ремонта.": "In a week you need 1 ETH: a repair bill.", "Рынок штормит": "The market is stormy", "lsETH на DEX: 0,92 ETH": "lsETH on the DEX: 0.92 ETH", "Очередь вывода в протоколе: 5 дней, 1:1": "Protocol withdrawal queue: 5 days, 1:1", "Продать на DEX сейчас": "Sell on the DEX now", "Встать в очередь вывода": "Join the withdrawal queue", "Очередь вывода": "Withdrawal queue", "Осталось 5 дней": "5 days left", "Промотать 5 дней": "Fast-forward 5 days", "Получено 1,0008 ETH": "Received 1.0008 ETH", "Вклад и награда за неделю, без дисконта": "Deposit and a week's reward, no discount", "Цена ETH": "ETH price", "Залог": "Collateral", "Долг": "Debt", "Внести 2 ETH в залог": "Deposit 2 ETH as collateral", "Сколько занять? Порог ликвидации 80%.": "How much to borrow? Liquidation threshold 80%.", "Ликвидации не было": "No liquidation happened", "После падения HF остался выше 1.": "After the fall the HF stayed above 1.", "HF ниже 1,5": "HF below 1.5", "Слишком мало запаса. Нажмите «Промотать», чтобы увидеть, чем это кончится.": "Not enough margin. Press “Fast-forward” to see how it ends.", "<button class=\"btn\" data-act=\"crash\">Промотать: ETH −30%</button>": "<button class=\"btn\" data-act=\"crash\">Fast-forward: ETH −30%</button>", "CubeSwap · пул ETH/USDC": "CubeSwap · ETH/USDC pool", "Внести 1 ETH + 3 000 USDC в пул": "Deposit 1 ETH + 3,000 USDC into the pool", "Ваша позиция": "Your position", "Доля в пуле: 6 000 $": "Share in the pool: $6,000", "Промотать: ETH вырос до 6 000 $": "Fast-forward: ETH rose to $6,000", "Не совсем": "Not quite", "В пуле: 0,707 ETH + 4 243 USDC = 8 485 $": "In the pool: 0.707 ETH + 4,243 USDC = $8,485", "Если бы просто держали 1 ETH и 3 000 USDC: 9 000 $": "If you had just held 1 ETH and 3,000 USDC: $9,000", "Сколько вы недополучили из-за непостоянных потерь?": "How much did you miss out on because of impermanent loss?", "Фермы": "Farms", "Верно: ≈ 5,7%": "Correct: ≈ 5.7%", "Пул продавал ETH по мере роста цены.": "The pool sold ETH as its price rose.", "LP-токены в ферме CubeSwap": "LP tokens in the CubeSwap farm", "9% годовых комиссиями и наградами": "9% APY from fees and rewards", "Куда положить LP-токены?": "Where do you put the LP tokens?", "Ферма CubeSwap": "CubeSwap farm", "9% годовых · аудит · работает 3 года": "9% APY · audited · running for 3 years", "3 000% годовых": "3,000% APY", "команда анонимная · контракт не верифицирован": "anonymous team · contract not verified", "Разместить 1 000 $": "Place $1,000", "Типы определены верно": "Types identified correctly", "Размещено": "Placed", "500 USDCube и 500 DAIcube: два разных вида обеспечения": "500 USDCube and 500 DAIcube: two different kinds of backing", "Всё в TerraCube": "Everything in TerraCube", "20% годовых": "20% APY", "Поровну USDCube и DAIcube": "Half USDCube, half DAIcube", "2–4% годовых, два разных вида обеспечения": "2–4% APY, two different kinds of backing", "  uint256 public fee = 2; // процент с перевода": "  uint256 public fee = 2; // percent of each transfer", "USDC · ровно 100": "USDC · exactly 100", " · неизвестный": " · unknown", "USDC · без ограничений": "USDC · unlimited", "OldFarm · закрыт в 2024": "OldFarm · closed in 2024", "LP-токены · без ограничений": "LP tokens · unlimited", "CubeApes · все NFT": "CubeApes · all NFTs", "Смарт-контракты и финал": "Smart contracts and the finale", "Курс Cryptocube пройден. Вы читаете контракты, расшифровываете вызовы, отзываете разрешения, работаете с мультиподписью, выпускаете свой токен и получили сертификат в тестовой сети.": "You've completed the Cryptocube course. You read contracts, decode calls, revoke approvals, work with multisig, issue your own token and earned a certificate on the testnet.", "Sepolia (тест)": "Sepolia (test)", "Чтение кода": "Reading code", "Читаем контракт перед покупкой": "Read a contract before buying", "Друг советует купить новый токен CMOON. Найдите в коде строки, которые дают владельцу власть над вашими деньгами.": "A friend recommends buying the new token CMOON. Find the lines in the code that give the owner power over your money.", "Найти скрытую эмиссию": "Find the hidden minting", "Найти комиссию без верхнего предела": "Find the fee with no upper limit", "onlyOwner значит, что функцию может вызвать только владелец контракта. «Награда держателям», которая выпускает токены владельцу, — это печатный станок: он напечатает и продаст. Комиссия без верхнего предела может стать 100%, и продать токен станет невозможно.": "onlyOwner means only the contract owner can call the function. A “reward holders” function that mints tokens to the owner is a printing press: they print and sell. A fee with no upper limit can become 100%, and then the token can't be sold.", "Подпись вызова": "Reading a call", "Что на самом деле подписывает кошелёк": "What your wallet actually signs", "Два сайта просят подтвердить транзакцию. Прочитайте расшифровку вызова, а не кнопку сайта.": "Two sites ask you to confirm a transaction. Read the decoded call, not the site's button.", "Подтвердить честный перевод, сверив расшифровку": "Confirm the honest transfer by checking the decoded call", "Отклонить setApprovalForAll под видом минта": "Reject setApprovalForAll disguised as a mint", "Транзакция к контракту — это функция и её аргументы (calldata). Первые 4 байта — селектор функции: a9059cbb это transfer, a22cb465 это setApprovalForAll. Хороший кошелёк расшифровывает их. setApprovalForAll отдаёт оператору право забрать все NFT коллекции.": "A transaction to a contract is a function and its arguments (calldata). The first 4 bytes are the function selector: a9059cbb is transfer, a22cb465 is setApprovalForAll. A good wallet decodes them. setApprovalForAll gives an operator the right to take the whole NFT collection.", "Отзыв разрешений": "Revoking approvals", "Отзываем старые разрешения": "Revoke old approvals", "Проверьте, кому вы разрешили тратить токены, и отзовите всё лишнее.": "Check who you've allowed to spend your tokens, and revoke everything unnecessary.", "Отозвать три опасных разрешения": "Revoke three dangerous approvals", "Разрешения (approve и setApprovalForAll) живут бессрочно, даже если вы забыли о сайте. Раз в несколько месяцев проверяйте их в кошельке или обозревателе блоков и отзывайте лишние. Отзыв — это обычная транзакция, подписи на сторонних сайтах для него не нужны.": "Approvals (approve and setApprovalForAll) last forever, even if you've forgotten the site. Every few months check them in your wallet or a block explorer and revoke the ones you don't need. Revoking is a normal transaction; you don't need signatures on third-party sites for it.", "Мультиподпись": "Multisig", "Казна клуба на мультиподписи 2 из 3": "The club treasury on a 2-of-3 multisig", "Оплатите из казны клуба 500 USDC дизайнеру. Владельцы: вы, Маша и Пётр, нужно 2 подписи из 3.": "Pay the designer 500 USDC from the club treasury. Owners: you, Masha and Petr; 2 of 3 signatures are required.", "Предложить транзакцию и подписать": "Propose the transaction and sign it", "Собрать вторую подпись и исполнить": "Collect the second signature and execute", "Мультиподпись требует несколько ключей для каждой операции, поэтому кража одного ключа ничего не даёт. Самая опасная операция в ней — смена владельцев и порога. Такие просьбы проверяют по другому каналу связи.": "A multisig requires several keys for each operation, so stealing one key gets nothing. The most dangerous operation in it is changing the owners and the threshold. Such requests should be verified through a different channel.", "Свой токен": "Your own token", "Выпускаем свой ERC-20": "Issue your own ERC-20", "Выпустите учебный токен в тестовой сети и откажитесь от прав владельца.": "Issue a training token on the testnet and give up the owner's rights.", "Развернуть контракт из своего кошелька": "Deploy the contract from your own wallet", "Отказаться от прав владельца": "Renounce ownership", "Выпустить токен может любой за пару минут, поэтому сам факт токена ничего не значит. Отказ от прав владельца (renounceOwnership) показывает, что больше никто не напечатает токены и не поменяет правила. Деплой подписывают в своём кошельке, приватный ключ никому не отдают.": "Anyone can issue a token in a couple of minutes, so the token itself means nothing. Renouncing ownership (renounceOwnership) shows that nobody can mint more tokens or change the rules anymore. You sign the deployment in your own wallet and never give the private key to anyone.", "Публичное размещение токенов и привлечение денег регулируется законом. Здесь токен учебный и живёт только в тестовой сети.": "Public token offerings and fundraising are regulated by law. Here the token is for training and lives only on the testnet.", "Финал": "Finale", "Финал в тестовой сети и сертификат": "Finale on the testnet and the certificate", "Пройдите финальный чек-лист в тестовой сети Sepolia и выпустите непередаваемый сертификат.": "Complete the final checklist on the Sepolia testnet and issue a non-transferable certificate.", "Пройти финальный чек-лист": "Complete the final checklist", "Выпустить сертификат Cryptocube": "Issue the Cryptocube certificate", "Тестовые сети работают как настоящие, но их монеты ничего не стоят и раздаются бесплатно в кранах. Soulbound-токен нельзя передать или продать: он подтверждает, что именно этот адрес прошёл курс.": "Testnets work like real networks, but their coins are worthless and handed out free from faucets. A soulbound token can't be transferred or sold: it proves that this exact address completed the course.", "В прототипе выпуск сертификата смоделирован. В рабочей версии он пройдёт в настоящей сети Sepolia.": "In the prototype, issuing the certificate is simulated. In the full version it will go through the real Sepolia network.", "Верно: «награда держателям» печатает токены владельцу. Он может выпустить миллиард и продать их вам.": "Correct: “reward holders” prints tokens for the owner. They can mint a billion and sell them to you.", "Верно: владелец может поставить комиссию 100%, и любой перевод или продажа отдаст ему всё.": "Correct: the owner can set the fee to 100%, and any transfer or sale hands everything to them.", "Эта строка безопасна: ": "This line is safe: ", "начальный выпуск при создании контракта, один раз.": "the initial supply, minted once when the contract is created.", "комиссия уходит владельцу, но пока она 2%. Ищите, кто может её менять.": "the fee goes to the owner, but it's 2% for now. Look for who can change it.", "обычная часть токена ERC-20.": "a normal part of an ERC-20 token.", "Владелец напечатал и продал": "The owner printed and sold", "Через неделю владелец вызвал rewardHolders, выпустил 50 млн CMOON и продал их в пул. Цена упала на 98%. Потом поставил комиссию 100%, и продать остатки стало невозможно.": "A week later the owner called rewardHolders, minted 50 million CMOON and sold them into the pool. The price fell 98%. Then they set the fee to 100%, and the remaining coins became impossible to sell.", "Все NFT ушли оператору": "All NFTs went to the operator", "Кнопка обещала бесплатный минт, а расшифровка показывала setApprovalForAll(оператор, true). Оператор забрал все 4 NFT коллекции CubeApes одной транзакцией.": "The button promised a free mint, but the decoded call showed setApprovalForAll(operator, true). The operator took all 4 CubeApes NFTs in one transaction.", "«Бесплатный отзыв» оказался дрейнером": "“Free revoke” turned out to be a drainer", "Сайт revoke-free.example попросил подписать Permit «для проверки». Отзыв разрешений — обычная транзакция в вашем кошельке, никаких подписей на сторонних сайтах.": "The site revoke-free.example asked you to sign a Permit “for a check”. Revoking approvals is a normal transaction in your own wallet, with no signatures on third-party sites.", "Казну увели": "The treasury was taken", "«Пётр с нового номера» был мошенником. Порог 1 из 3 и новый владелец позволили ему одной подписью вывести все 5 000 USDC.": "“Petr from a new number” was a scammer. A 1-of-3 threshold and a new owner let him take all 5,000 USDC with one signature.", "Ключ ушёл «сервису»": "The key went to a “service”", "easy-token.example попросил приватный ключ, «чтобы развернуть за вас». Через минуту с этого адреса ушли все средства во всех сетях. Деплой подписывают в своём кошельке.": "easy-token.example asked for your private key “so it can deploy for you”. A minute later everything was gone from this address on every network. You sign the deployment in your own wallet.", "Финал в Sepolia": "Finale on Sepolia", "Стоп, это ошибка": "Stop, this is a mistake", "Чек-лист пройден": "Checklist complete", "Осталось выпустить сертификат.": "Only the certificate is left to issue.", "<button class=\"btn\" data-act=\"cert\">Выпустить сертификат (подписать mint в Sepolia)</button>": "<button class=\"btn\" data-act=\"cert\">Issue the certificate (sign the mint on Sepolia)</button>", "Для финала нужен тестовый ETH в сети Sepolia.": "The finale needs test ETH on the Sepolia network.", "Купить 1 SepoliaETH за 15 $ у продавца в чате": "Buy 1 SepoliaETH for $15 from a seller in the chat", "Тестовые монеты ничего не стоят и раздаются бесплатно. Продавец просто заберёт 15 $.": "Test coins are worthless and handed out free. The seller will simply take your $15.", "Взять бесплатно в кране (faucet)": "Get it for free from a faucet", "Кран бесплатно выдаёт тестовые монеты.": "A faucet gives out test coins for free.", "Где вы храните seed-фразу основного кошелька?": "Where do you keep the seed phrase of your main wallet?", "Офлайн: на бумаге или металле, в надёжном месте": "Offline: on paper or metal, in a safe place", "Seed-фраза не должна касаться интернета.": "A seed phrase should never touch the internet.", "В заметках телефона, они синхронизируются": "In the phone's notes, they sync", "Облачная синхронизация — это копия ключей на чужом сервере.": "Cloud sync is a copy of your keys on someone else's server.", "Крупная сумма лежит…": "A large sum is sitting…", "На аппаратном кошельке, на горячем только мелочь": "On a hardware wallet; only small change on the hot wallet", "Ключи от крупных сумм не должны быть на устройстве, которое ходит в интернет.": "Keys for large sums shouldn't live on a device that goes online.", "На бирже, там же есть поддержка": "On the exchange, which has support anyway", "Не ваши ключи — не ваши монеты. Вспомните CubeX.": "Not your keys, not your coins. Remember CubeX.", "Кошелёк показывает: mint(to: ваш адрес), контракт Cryptocube Certificate, сеть Sepolia, газ 0,0003 SepoliaETH.": "The wallet shows: mint(to: your address), contract Cryptocube Certificate, Sepolia network, gas 0.0003 SepoliaETH.", "Переключиться на основную сеть Ethereum, чтобы сертификат был «настоящим»": "Switch to the main Ethereum network so the certificate is “real”", "Контракт сертификата живёт в Sepolia. В основной сети вы заплатили бы настоящий газ за вызов по чужому адресу.": "The certificate contract lives on Sepolia. On the main network you would pay real gas for a call to someone else's address.", "Подписать: сеть тестовая, функция и адрес понятны": "Sign it: the network is a testnet, and the function and address are clear", "Вы проверили сеть, функцию и получателя. Это и есть привычка, ради которой был курс.": "You checked the network, the function and the recipient. That's the habit the course was for.", "Обозреватель · CubeMoon": "Explorer · CubeMoon", "Нажмите на строку, которая кажется опасной.": "Tap the line that looks dangerous.", "Купить CMOON на 100 USDC": "Buy CMOON for 100 USDC", "Запрос транзакции": "Transaction request", "Оплатить заказ: 10 USDC": "Pay the order: 10 USDC", "Расшифровка": "Decoded call", "Контракт": "Contract", "Функция": "Function", "Заказ оплачен": "Order paid", "Расшифровка совпала с тем, что обещал сайт.": "The decoded call matches what the site promised.", "Бесплатный минт CubeApes #2": "Free mint of CubeApes #2", "Только сегодня!": "Today only!", "CubeApes (у вас 4 NFT)": "CubeApes (you hold 4 NFTs)", "Минт отклонён": "Mint rejected", "Все 4 NFT CubeApes на месте.": "All 4 CubeApes NFTs are safe.", "<span class=\"status ok\">Отозвано</span>": "<span class=\"status ok\">Revoked</span>", "Отозвать · газ 0,0004 ETH": "Revoke · gas 0.0004 ETH", "Опасные разрешения отозваны": "Dangerous approvals revoked", "Точное разрешение роутера можно оставить: оно ограничено суммой.": "The router's exact approval can stay: it's limited to an amount.", "RevokeHel деплой в своём кошельке": "Sign the deployment in your own wallet", "easy-token.example: «Вставьте приватный ключ, развернём за вас»": "easy-token.example: “Paste your private key, we'll deploy for you”", "Контракт развёрнут": "Contract deployed", "Адрес: ": "Address: ", "есть у владельца": "owner has it", "нет": "no", "нет (0x000…0000)": "no (0x000…0000)", "вы": "you", "renounceOwnership: отказаться от прав": "renounceOwnership: give up the rights", "Права владельца сожжены": "Owner rights burned", "Выпущено": "Issued", "Право выпуска": "Minting right", "Владелец": "Owner", "Сертификат Cryptocube": "Cryptocube certificate", "Кубиков пройдено:": "Cubes completed:", "из 6 ·": "of 6 ·", "Непередаваемый: нельзя продать или отправить.": "Non-transferable: can't be sold or sent.", "Первый кошелёк": "First wallet", "Безопасность": "Security", "Кубик ": "Cube ", "<span class=\"muted\" style=\"padding:6px 4px 6px 8px;font-size:13px\">Кубик</span>": "<span class=\"muted\" style=\"padding:6px 4px 6px 8px;font-size:13px\">Cube</span>", "Приложение или устройство, которое хранит ключи и подписывает транзакции. Сами монеты лежат в блокчейне, а не в кошельке.": "An app or device that holds keys and signs transactions. The coins themselves live on the blockchain, not in the wallet.", "12–24 слова, из которых получаются все ключи кошелька. Кто знает фразу, тот владеет деньгами. Хранится только офлайн.": "12–24 words from which all the wallet's keys are derived. Whoever knows the phrase owns the money. Keep it offline only.", "Приватный ключ": "Private key", "Секретное число, которым подписываются транзакции. Получается из seed-фразы. Никому не передаётся.": "A secret number used to sign transactions. Derived from the seed phrase. Never shared with anyone.", "Адрес": "Address", "Публичный идентификатор для получения средств, как номер счёта. Его можно давать всем.": "A public identifier for receiving funds, like an account number. You can share it with anyone.", "Подписанная команда y is defined by the contract address, not the name.", "Поддельный сайт или письмо, которые выманивают seed-фразу, пароль или подпись.": "A fake site or email that lures you into giving up a seed phrase, password or signature.", "Подмена адреса": "Address poisoning", "Мошенник создаёт адрес, похожий на нужный по краям, и подбрасывает его в историю переводов (address poisoning).": "A scammer creates an address resembling the real one at the edges and drops it into your transaction history (address poisoning).", "Дрейнер": "Drainer", "Вредоносный контракт или сайт, который после вашей подписи выводит все токены.": "A malicious contract or site that moves all your tokens after you sign.", "Подпись-разрешение тратить ваши токены без отдельной транзакции. Опасна тем, что выглядит как обычная подпись.": "A signed permission to spend your tokens without a separate transaction. Dangerous because it looks like an ordinary signature.", "Отдельное устройство, которое хранит ключи офлайн и показывает транзакцию на своём экране.": "A separate device that keeps keys offline and shows the transaction on its own screen.", "Know Your Customer: проверка личности клиента, которую по закону проводят биржи.": "Know Your Customer: identity checks that exchanges are legally required to perform.", "Двухфакторная защита: кроме пароля нужен код из приложения или ключа.": "Two-factor protection: besides the password you need a code from an app or a key.", "Биржа (CEX)": "Exchange (CEX)", "Централизованная площадка: хранит ваши средства у себя и сводит покупателей с продавцами.": "A centralised venue: it holds your funds itself and matches buyers and sellers.", "Децентрализованная биржа: обмен идёт через смарт-контракт прямо из вашего кошелька.": "Decentralised exchange: the swap runs through a smart contract straight from your wallet.", "Список заявок на покупку и продажу по разным ценам.": "A list of buy and sell orders at different prices.", "Лимитный ордер": "Limit order", "Заявка, которая const QUIZ = [
  { q: TR('Что произойдёт, если кто-то изменит старую запись в своей копии блокчейна?'), a: [TR('Изменение разойдётся по всей сети'), TR('Сеть отвергнет его копию: отпечатки блоков не сойдутся'), TR('Запись удалится через сутки')], r: 1 },
  { q: TR('Кто хранит копии блокчейна?'), a: [TR('Один банк'), TR('Компания, выпустившая монету'), TR('Тысячи независимых участников сети')], r: 2 },
  { q: TR('Что связывает блоки в цепочку?'), a: [TR('Каждый блок хранит хэш предыдущего'), TR('Номер телефона владельца'), TR('Пароль администратора')], r: 0 },
];

const BLOCKS0 = [TR('Маша → Пётр: 2 ETH'), TR('Пётр → Инна: 0,5 ETH'), TR('Инна → Маша: 1 ETH'), TR('Маша → Аня: 0,3 ETH')];

const hsh = s => { let x = 0x811c9dc5; for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 0x01000193) >>> 0; } return x.toString(16).padStart(8, '0'); };
const addrOf = seed => '0x' + [0, 1, 2, 3, 4].map(i => hsh(seed + '#' + i)).join('');
const txHash = s => '0x' + [0, 1, 2, 3, 4, 5, 6, 7].map(i => hsh(s + i)).join('');
const short = a => a.slice(0, 6) + '…' + a.slice(-4);
const fmt = n => (Math.round(n * 1e6) / 1e6).toLocaleString(LOCALE, { maximumFractionDigits: 6 });
const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return m > 10 && m < 20 ? c : k === 1 ? a : k > 1 && k < 5 ? b : c; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pick = (arr, k) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a.slice(0, k); };

function fresh() {
  return { face: 1, done: {}, st: {}, xp: 0, traps: 0, tab: 'home', view: null,
    f1: { blocks: BLOCKS0.slice(), quiz: {} },
    w: { app: false, pin: '', pin1: '', seed: [], written: false, confirm: null, confirmSel: {}, storage: null, addr: '' },
    bal: { me: { ETH: 0, CUBE: 0 }, masha: { ETH: 1.2 }, petr: { ETH: 0.3 } },
    tokens: ['ETH'], txs: [], chat: [], block: 19824510,
    f4: { tokenSearch: false }, f5: { amount: '0.05', fee: 'normal', review: false, feeAns: null, lastTx: null },
    f6: { stage: 'wiped', words: Array(12).fill(''), paper: false, scamFirst: Math.random() < 0.5, invoice: false, payTo: null },
    trap: null, snap: null };
}
let S;
try { S = JSON.parse(localStorage.getItem('cryptocube-1') || 'null'); } catch (e) { S = null; }
if (!S || !S.f6) S = fresh();
S.trap = null;
const save = () => { try { localStorage.setItem('cryptocube-1', JSON.stringify(S)); } catch (e) {} };

const stepDone = id => !!S.st[id];
function mark(id) {
  if (S.st[id]) return;
  S.st[id] = true; S.xp += 50;
  const f = FACES[S.face - 1];
  if (f.steps.every(([k]) => S.st[k]) && !S.done[f.n]) { S.done[f.n] = true; S.xp += 100; }
}
function trap(title, text, restore) {
  S.traps += 1;
  S.trap = { title, text, restore: !!restore };
}
function say(who, text, extra) { S.chat.push(Object.assign({ who, text }, extra || {})); }

const FEE = { slow: { label: TR('Медленно'), eta: TR('~10 мин'), fee: 0.0016 }, normal: { label: TR('Обычно'), eta: TR('~30 сек'), fee: 0.0042 }, fast: { label: TR('Срочно'), eta: TR('~12 сек'), fee: 0.031 } };

function sendTx(from, to, amount, fee, asset, note) {
  const h = txHash(from + to + amount + Date.now() + Math.random());
  const tx = { hash: h, from, to, amount, fee, asset: asset || 'ETH', status: 'pending', block: null, note: note || '' };
  S.txs.unshift(tx);
  const who = k => k === S.w.addr ? 'me' : k === MASHA ? 'masha' : k === PETR ? 'petr' : null;
  const a = who(from), b = who(to);
  if (a) S.bal[a][tx.asset] = (S.bal[a][tx.asset] || 0) - amount - (tx.asset === 'ETH' ? fee : 0);
  if (a && tx.asset !== 'ETH') S.bal[a].ETH -= fee;
  setTimeout(() => {
    const t = S.txs.find(x => x.hash === h); if (!t) return;
    t.status = 'ok'; S.block += 1 + Math.floor(Math.random() * 3); t.block = S.block;
    if (b) S.bal[b][t.asset] = (S.bal[b][t.asset] || 0) + amount;
    onConfirmed(t); render();
  }, 2200);
  return tx;
}
function onConfirmed(t) {
  if (S.face === 4 && t.from === MASHA && t.to === S.w.addr) {
    mark('f4-recv');
    say(TR('Маша'), TR('Отправила 0,1 ETH, проверь!'));
    setTimeout(() => { say(TR('Маша'), TR('Слушай, а пришли мне свои 12 слов? Я гляну, правильно ли у тебя всё настроено 🙂'), { choice: 'seedask' }); render(); }, 1400);
  }
  if (S.face === 4 && t.asset === 'CUBE') say('Cube Project', TR('Начислили 100 учебных CUBE за регистрацию.'));
  if (t.from === S.w.addr && t.to === MASHA && S.face === 5) { mark('f5-send'); say(TR('Маша'), TR('Пришло, спасибо!')); }
  if (t.from === S.w.addr && t.to === PETR && S.face === 6) { S.chat.forEach(m => { if (m.choice === 'invoice') m.choice = null; }); mark('f6-pay'); say(TR('Пётр'), TR('Оплата получена, заказ отправляю.')); }
}

/* ---------- actions ---------- */
const A = {
  reset() { S = fresh(); },
  goface(n) { n = +n; if (n === 1 || S.done[n - 1]) { S.face = n; S.trap = null; S.view = null; enterFace(); } },
  next() { if (S.face < 6) { S.face += 1; S.view = null; enterFace(); } },
  closetrap() { const r = S.trap && S.trap.restore; S.trap = null; if (r && S.snap) { const keep = { xp: S.xp, traps: S.traps }; S = Object.assign(JSON.parse(S.snap), keep); S.snap = null; } },
  tab(t) { S.tab = t; S.view = null; },
  view(v) { S.view = v; },
  quiz(arg) { const [i, j] = arg.split(':').map(Number); S.f1.quiz[i] = j; if (QUIZ.every((q, k) => S.f1.quiz[k] === q.r)) mark('f1-quiz'); },
  tamper() { S.f1.blocks[1] = TR('Пётр → Инна: 50 ETH'); mark('f1-tamper'); },
  untamper() { S.f1.blocks = BLOCKS0.slice(); },
  app(kind) {
    if (kind === 'fake') { trap(TR('Это поддельное приложение'), TR('Разработчик «Cube Wallett Inc» (две t), 1 тыс. установок и пометка «Реклама». Такие копии крадут seed-фразу при первом же вводе. Ставьте кошелёк только по ссылке с официального сайта.')); return; }
    S.w.app = true;
    if (S.face === 2) mark('f2-app');
    if (S.face === 6) { mark('f6-app'); S.f6.stage = 'restore'; }
  },
  key(d) {
    if (S.view === 'pinerr') S.view = null;
    if (d === 'del') { if (S.w.pin1 && S.w.pin1.length === 6) S.w.pin = S.w.pin.slice(0, -1); else S.w.pin1 = S.w.pin1.slice(0, -1); return; }
    if (!S.w.pin1 || S.w.pin1.length < 6) { S.w.pin1 = (S.w.pin1 || '') + d; return; }
    S.w.pin += d;
    if (S.w.pin.length === 6) {
      if (S.w.pin !== S.w.pin1) { S.w.pin = ''; S.w.pin1 = ''; S.view = 'pinerr'; return; }
      S.w.seed = pick(WORDS, 12); S.w.addr = addrOf(S.w.seed.join(' '));
      mark('f2-pin'); S.view = null;
    }
  },
  seedbad(kind) {
    const t = kind === 'shot'
      ? [TR('Скриншот попал в облачную галерею'), TR('Фото синхронизируются с облаком, их видят приложения с доступом к галерее. Вредоносные программы специально ищут на снимках 12 английских слов.')]
      : [TR('Облачная заметка — не хранилище для seed'), TR('Взломали почту или облако, и деньги ушли. Seed-фраза должна существовать только офлайн.')];
    trap(t[0], t[1]);
  },
  written() {
    S.w.written = true; mark('f3-write');
    const idx = pick([...Array(12).keys()], 3).sort((a, b) => a - b);
    S.w.confirm = idx.map(i => ({ i, opts: pick(pick(WORDS.filter(w => w !== S.w.seed[i]), 5).concat(S.w.seed[i]), 6) }));
    S.w.confirmSel = {};
  },
  csel(arg) { const [k, w] = arg.split(':'); S.w.confirmSel[k] = w; },
  confirm() {
    const ok = S.w.confirm.every((c, k) => S.w.confirmSel[k] === S.w.seed[c.i]);
    if (ok) mark('f3-confirm');
    else { S.view = 'confirmerr'; S.w.confirmSel = {}; }
  },
  store(kind) {
    if (kind === 'notes' || kind === 'photo') { trap(kind === 'notes' ? TR('Заметки синхронизируются') : TR('Галерея тоже синхронизируется'), TR('Всё, что лежит в телефоне, уходит в облако и в резервные копии. Seed-фраза должна существовать только на бумаге или металле.')); return; }
    S.w.storage = kind; mark('f3-store');
  },
  sendaddr() { if (stepDone('f4-addr')) return; mark('f4-addr'); say(TR('Вы'), TR('Мой адрес: ') + S.w.addr, { me: true }); S.tab = 'chat'; S.view = null; setTimeout(() => { sendTx(MASHA, S.w.addr, 0.1, 0.0009, 'ETH'); render(); }, 900); },
  seedask(ans) {
    if (ans === 'give') { trap(TR('Друга взломали'), TR('Аккаунт Маши угнали, и писал мошенник. Получив 12 слов, он вывел бы всё за минуту. Seed-фразу не просит никто: ни друзья, ни поддержка, ни «проверка настроек».')); return; }
    S.chat.forEach(m => { if (m.choice === 'seedask') m.choice = null; });
    say(TR('Вы'), TR('Нет, seed-фразу никому не отправляю.'), { me: true });
    say(TR('Маша'), TR('Это была не я! Мой аккаунт угоняли, уже вернула. Молодец, что не прислал(а).'));
    mark('f4-refuse');
  },
  tokensearch() { S.view = 'token'; },
  addtoken(kind) {
    if (kind === 'fake') { trap(TR('Это токен-подделка'), TR('Название и тикер совпадают, а адрес контракта — нет (в конце «l9» вместо «19»). Такой токен ничего не стоит, а сайт, где его «покупают», крадёт деньги.')); return; }
    if (!S.tokens.includes('CUBE')) S.tokens.push('CUBE');
    S.view = null; mark('f4-token');
    sendTx(TOKEN_REAL, S.w.addr, 100, 0, 'CUBE');
  },
  sendform() { S.view = 'send'; S.f5.review = false; },
  fee(k) { S.f5.fee = k; },
  review() {
    const amt = parseFloat(String(S.f5.amount).replace(',', '.'));
    if (!(amt > 0)) { S.view = 'send'; S.f5.err = TR('Введите сумму больше нуля'); return; }
    if (amt + FEE[S.f5.fee].fee > S.bal.me.ETH + 1e-9) { S.f5.err = TR('Не хватает ETH на сумму и комиссию'); return; }
    S.f5.err = ''; S.f5.review = true;
  },
  confirmsend() {
    const to = S.f5.to || MASHA;
    const amt = parseFloat(String(S.f5.amount).replace(',', '.'));
    const fee = FEE[S.f5.fee].fee;
    if (S.f5.fee === 'fast') {
      S.snap = JSON.stringify(Object.assign({}, S, { trap: null }));
      sendTx(S.w.addr, to, amt, fee);
      trap(TR('Комиссия дороже половины перевода'), TR('Вы отдали ') + fmt(fee) + TR(' ETH валидаторам за перевод ') + fmt(amt) + TR(' ETH. Перевод другу не горит: «Обычно» дошло бы за полминуты за ') + fmt(FEE.normal.fee) + TR(' ETH. Отмотаем время, попробуйте ещё раз.'), true);
      return;
    }
    const tx = sendTx(S.w.addr, to, amt, fee);
    S.f5.lastTx = tx.hash; S.view = null; S.f5.review = false; S.f5.to = null; S.tab = 'home';
  },
  opentx(h) { S.view = 'tx:' + h; if (S.face === 5 && h === S.f5.lastTx) mark('f5-explorer'); },
  feeans(v) { S.f5.feeAns = v; const t = S.txs.find(x => x.hash === S.f5.lastTx); if (t && Math.abs(t.fee - +v) < 1e-9) mark('f5-fee'); },
  newphone() { S.f6.stage = 'store'; S.w.app = false; },
  paper() { S.f6.paper = true; },
  restore() {
    const ok = S.f6.words.map(w => w.trim().toLowerCase()).join(' ') === S.w.seed.join(' ');
    if (!ok) { S.view = 'restoreerr'; return; }
    mark('f6-restore'); S.f6.stage = 'home'; S.view = null;
    const scam = () => say(TR('Поддержка Cube Wallet'), TR('Здравствуйте! После восстановления ваш кошелёк помечен как подозрительный. Пройдите верификацию: отправьте 12 слов в этот чат в течение 30 минут.'), { choice: 'scam', scam: true });
    const inv = () => { say(TR('Пётр'), TR('Счёт за заказ: 0,02 ETH. Адрес: ') + PETR, { choice: 'invoice' }); S.f6.invoice = true; };
    if (S.f6.scamFirst) { scam(); inv(); } else { inv(); scam(); }
  },
  scam(ans) {
    if (ans === 'give') { trap(TR('Это мошенник'), TR('Настоящая поддержка не пишет первой и никогда не просит seed-фразу. Аккаунт ') + SUPPORT + TR(' создан вчера. Пожалуйтесь на него и не отвечайте.')); return; }
    S.chat.forEach(m => { if (m.choice === 'scam') m.choice = null; });
    say(TR('Вы'), TR('Заблокировать и пожаловаться'), { me: true }); mark('f6-scam');
  },
  invoice() { S.view = 'send'; S.f5.to = PETR; S.f5.amount = '0.02'; S.f5.fee = 'normal'; S.f5.review = false; S.tab = 'home'; },
};

function enterFace() {
  S.tab = 'home';
  if (S.face === 4 && !S.chat.length) say(TR('Маша'), TR('Привет! Хочу скинуть тебе 0,1 ETH на первый кошелёк. Пришли адрес.'));
  if (S.face === 5 && !S.chat.some(m => m.f5)) say(TR('Маша'), TR('Вернёшь 0,05 ETH, когда сможешь? Не срочно.'), { f5: true });
  if (S.face === 6 && S.f6.stage === 'wiped' && !stepDone('f6-app')) { S.w.app = false; }
}

/* ---------- render ---------- */
const $ = id => document.getElementById(id);
const ROT = { 1: 'rotateX(-14deg) rotateY(20deg)', 2: 'rotateX(-14deg) rotateY(-70deg)', 3: 'rotateX(-14deg) rotateY(-160deg)', 4: 'rotateX(-14deg) rotateY(110deg)', 5: 'rotateX(-80deg) rotateY(20deg)', 6: 'rotateX(76deg) rotateY(20deg)' };

function renderCube() {
  $('cube').style.transform = ROT[S.face];
  $('cube').innerHTML = FACES.map(f => `<div class="face f${f.n} ${S.done[f.n] ? 'lit' : ''}"><span class="n">${f.n}</span><span class="t">${f.short}</span></div>`).join('');
  $('facelist').innerHTML = FACES.map(f => {
    const open = f.n === 1 || S.done[f.n - 1];
    const st = S.done[f.n] ? TR('пройдена') : f.n === S.face ? TR('сейчас') : open ? TR('открыта') : TR('закрыта');
    return `<li><button class="${S.done[f.n] ? 'done' : ''} ${f.n === S.face ? 'cur' : ''}" data-act="goface" data-arg="${f.n}" ${open ? '' : 'disabled'}><span class="num">${f.n}</span><span>${f.short}</span><span class="st">${st}</span></button></li>`;
  }).join('');
  $('xp').textContent = S.xp + ' XP';
}

const bar = (title, right) => `<div class="statusbar"><span>9:41</span><span>${TR("Песочница · Ethereum")}</span></div><div class="appbar"><h2>${title}</h2>${right || ''}</div>`;
const tabs = () => {
  const unread = S.chat.some(m => m.choice && !(m.choice === 'invoice' && stepDone('f6-pay')));
  return `<nav class="tabs"><button class="${S.tab === 'home' ? 'on' : ''}" data-act="tab" data-arg="home">${TR("Кошелёк")}</button><button class="${S.tab === 'chat' ? 'on' : ''}" data-act="tab" data-arg="chat">${TR("Сообщения")}${unread && S.tab !== 'chat' ? '<span class="dot"></span>' : ''}</button><button class="${S.tab === 'explorer' ? 'on' : ''}" data-act="tab" data-arg="explorer">${TR("Обозреватель")}</button></nav>`;
};

  return bar(TR('Магазин приложений')) + `<div class="body">
    <div class="field"><label for="storeq">${TR("Поиск")}</label><input id="storeq" value="cube wallet" readonly></div>

function qr(a) {
  let bits = ''; for (let i = 0; i < 14; i++) bits += parseInt(hsh(a + i), 16).toString(2).padStart(32, '0');
  let out = '';
  for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) {
    const finder = (x < 7 && y < 7) || (x > 13 && y < 7) || (x < 7 && y > 13);
    let b;
    if (finder) { const fx = x > 13 ? x - 14 : x, fy = y > 13 ? y - 14 : y; b = fx === 0 || fx === 6 || fy === 0 || fy === 6 || (fx > 1 && fx < 5 && fy > 1 && fy < 5); }
    else b = bits[y * 21 + x] === '1';
    out += `<i class="${b ? 'b' : ''}"></i>`;
  }
  return out;
}

function fresh2() {
  return { face: 1, done: {}, st: {}, xp: 0, traps: 0, trap: null, snap: null, view: null, tab: 'chat',

    f1: { page: 'inbox' }, f2: { open: {}, pick: null },
    f3: { chat: 'list', asked: false, blocked: false },
    f4: { connected: false, req: null, signed: false },
    f5: { stage: 'buy', attempt: 0 },
    f6: { order: pick([...Array(10).keys()], 10), i: 0, lost: 0, missed: 0, last: null, failed: false } };
}
let T;
try { T = JSON.parse(localStorage.getItem('cryptocube-2') || 'null'); } catch (e) { T = null; }
if (!T || !T.f6) T = fresh2();
T.trap = null;
const save2 = () => { try { localStorage.setItem('cryptocube-2', JSON.stringify(T)); } catch (e) {} };

function mark2(id) {
  if (T.st[id]) return;
  T.st[id] = true; T.xp += 50;
  const f = FACES2[T.face - 1];
  if (f.steps.every(([k]) => T.st[k]) && !T.done[f.n]) { T.done[f.n] = true; T.xp += 100; }
}
function trap2(title, text, restore) { T.traps += 1; T.trap = { title, text, restore: !!restore }; }
const snap2 = () => { T.snap = JSON.stringify(Object.assign({}, T, { trap: null, snap: null })); };

const A2 = {
  reset() { T = fresh2(); },
  goface(n) { n = +n; if (n === 1 || T.done[n - 1] || DEMO2) { T.face = n; T.trap = null; T.view = null; } },
  next() { if (T.face < 6) { T.face += 1; T.view = null; } },
  closetrap() { const r = T.trap && T.trap.restore; T.trap = null; if (r && T.snap) { const keep = { xp: T.xp, traps: T.traps }; T = Object.assign(JSON.parse(T.snap), keep); T.snap = null; } },
  view(v) { T.view = v || null; },
  page(p) { T.f1.page = p; },
  phish() { trap2(TR('Вы ввели seed-фразу на поддельном сайте'), TR('Через минуту кошелёк опустел бы: фраза ушла на сервер мошенников. Ни один настоящий сервис не просит seed-фразу для «разблокировки» или «проверки».')); },
  report() { mark2('c2-report'); T.f1.page = 'inbox'; },
  bookmark() { mark2('c2-bookmark'); },
  expand(k) { T.f2.open[k] = !T.f2.open[k]; },
  pickto(k) { T.f2.pick = k; },
  send2() {
    if (!T.f2.pick) return;
    if (T.f2.pick === 'poison') { snap2(); T.bal.ETH -= 0.0142; trap2(TR('Деньги ушли мошеннику'), TR('Адрес из последнего «перевода» совпадал с Машиным только по краям: 0x9A4e…1b20. Середина другая. Отмотаем время: сверьте адрес целиком или возьмите из контактов.'), true); return; }
    T.bal.ETH -= 0.0142; T.sent.push(TR('Маша · 0,01 ETH')); mark2('c2-send');
  },
  contact() { mark2('c2-contact'); },
  chat(c) { T.f3.chat = c; },
  ask() { T.f3.asked = true; mark2('c2-ask'); },
  connectfake() { trap2(TR('«Инструмент восстановления» — дрейнер'), TR('Сайт wallet-repair.example попросил бы подписать разрешение на все токены. Настоящая поддержка не пишет первой и никуда не просит подключаться.')); },
  block() { T.f3.blocked = true; mark2('c2-block'); T.f3.chat = 'list'; },
  connect() { T.f4.connected = true; T.f4.req = 'signin'; },
  sign(kind) {
    if (kind === 'signin') { T.f4.signed = true; T.f4.req = null; mark2('c2-signin'); return; }
    snap2(); T.bal.USDC = 0; T.f4.req = null;
    trap2(TR('Дрейнер забрал все USDC'), TR('Подпись Permit разрешила адресу ') + DRAINER.slice(0, 10) + TR('… тратить ваши USDC без ограничений и бессрочно. Он сразу вывел 200 USDC. Отмотаем время: прочитайте предпросмотр и отклоните.'), true);
  },
  reject(kind) { T.f4.req = null; if (kind === 'permit') mark2('c2-reject'); },
  claim() { T.f4.req = 'permit'; },
  buy(kind) {
    if (kind === 'used') { trap2(TR('Seed-фраза уже в коробке'), TR('Продавец сгенерировал фразу заранее и оставил себе копию. Всё, что вы переведёте на это устройство, он заберёт. Настоящее устройство всегда создаёт новую фразу при настройке.')); return; }
    T.f5.stage = 'setup'; mark2('c2-buy');
  },
  hwseed() { T.f5.stage = 'move'; },
  hwmatch(ans) {
    const bad = T.f5.attempt === 0;
    if (bad && ans === 'yes') { trap2(TR('Вирус подменил адрес на компьютере'), TR('В приложении адрес отличался от того, что на экране устройства. Подтвердив его, вы отправили бы средства мошеннику. Верьте только экрану устройства.')); return; }
    if (bad && ans === 'no') { T.f5.attempt = 1; mark2('c2-verify'); return; }
    if (!bad && ans === 'no') { T.view = 'hwsame'; return; }
    T.hw = { ETH: 0.45, USDC: T.bal.USDC }; T.bal.ETH = Math.max(0, T.bal.ETH - 0.4512); T.bal.USDC = 0; T.f5.stage = 'done'; mark2('c2-move');
  },
  exam(ans) {
    const e = T.f6; const sc = EXAM[e.order[e.i]]; const acted = ans === 'act';
    let res = 'ok';
    if (acted && !sc.safe) { e.lost += 1; res = 'lost'; }
    if (!acted && sc.safe) { e.missed += 1; res = 'missed'; }
    e.last = { res, why: sc.why };
    e.i += 1;
    if (e.i >= 10) { if (e.lost === 0 && e.missed <= 1) mark2('c2-exam'); else e.failed = true; }
  },
  examretry() { T.f6 = fresh2().f6; },
};

function regCube(c) {
  let s; try { s = JSON.parse(localStorage.getItem('cryptocube-' + c.n) || 'null'); } catch (e) { s = null; }
  if (!s || s.v !== c.fresh().v) s = c.fresh();
  s.trap = null; c.S = s; CUBES[c.key] = c;
}
function baseState(v) { return { v, face: 1, done: {}, st: {}, xp: 0, traps: 0, trap: null, snap: null, view: null, q: {}, ql: {}, inp: {} }; }
function mk(id) {
  if (U.st[id]) return; U.st[id] = true; U.xp += 50;
  CUBES[CUR].faces.forEach(f => { if (!U.done[f.n] && f.steps.every(([k]) => U.st[k])) { U.done[f.n] = true; U.xp += 100; } });
}
function tp(title, text, restore) { U.traps += 1; U.trap = { title, text, restore: !!restore }; }
const sn = () => { U.snap = JSON.stringify(Object.assign({}, U, { trap: null, snap: null })); };

const GA = {
  reset() { U = CUBES[CUR].fresh(); },
  goface(n) { n = +n; if (n === 1 || U.done[n - 1]) { U.face = n; U.trap = null; U.view = null; } },
  next() { if (U.face < 6) { U.face += 1; U.view = null; } },
  closetrap() { const r = U.trap && U.trap.restore; U.trap = null; if (r && U.snap) { const keep = { xp: U.xp, traps: U.traps, st: U.st, done: U.done }; U = Object.assign(JSON.parse(U.snap), keep); U.snap = null; } },
  view(v) { U.view = v || null; },
  qa(arg) {
    const [qid, k] = arg.split(':'); const Q = CUBES[CUR].Q[qid]; const i = U.q[qid] || 0; const o = Q.stages[i].opts[+k];
    if (!o.ok) { tp(Q.trapTitle || TR('Ловушка сработала'), o.why); return; }
    U.q[qid] = i + 1; U.ql[qid] = o.why; if (i + 1 >= Q.stages.length) mk(Q.mark);
  },
};

function questHTML(qid) {
  const c = CUBES[CUR]; const Q = c.Q[qid]; const i = U.q[qid] || 0; const last = U.ql[qid];

  return barN(`${Q.title} · ${i + 1} ${TR("из")} ${Q.stages.length}`, '', net) + `<div class="body">${last && i ? okCard(TR('Верно'), last) : ''}

}

function briefN(c) {

  const final = all ? `<div class="done-banner final"><b>${TR("Кубик")} ${c.n} ${TR("собран")}</b><p>${c.final}</p>
    <div class="stats"><div><b>${U.xp}</b>XP</div><div><b>${U.traps}</b>${plural(U.traps, TR('ловушка сработала'), TR('ловушки сработали'), TR('ловушек сработало'))}</div></div>

  $('screen').innerHTML = c.phone(U.face) + trapNHTML();

        { l: TR('Спросить в чате, кто пришлёт газ за USDC'), ok: false, why: TR('В личку сразу напишет «помощник», возьмёт USDC и пропадёт.') }] },

        { l: TR('Держать в экранированном Zcash и дать бухгалтеру ключ просмотра'), ok: true, why: TR('Приватность для всех, прозрачность для тех, кому вы обязаны отчитаться.') }] },
      { t: TR('Конец года. Налоговая отчётность.'), opts: [

        { l: TR('Не декларировать: блокчейн анонимный'), ok: false, why: TR('Блокчейн публичен, а биржи передают данные налоговым органам. Неуплата налога — нарушение закона.') }] },

/* --- подсказки: оборачиваем первое упоминание каждого термина --- */
function annotate(root) {
  if (!root) return;
  const used = new Set(); let budget = 14;
  const walk = node => {
    for (const ch of Array.from(node.childNodes)) {
      if (budget <= 0) return;
      if (ch.nodeType === 1) { if (!/^(BUTTON|INPUT|TEXTAREA|A|H2|H3|SCRIPT)$/.test(ch.tagName) && !ch.classList.contains('term') && !ch.classList.contains('mono')) walk(ch); continue; }
      if (ch.nodeType !== 3 || ch.nodeValue.trim().length < 3) continue;
      let best = null;
      for (const g of GL) { if (used.has(g.t)) continue; const m = g.re.exec(ch.nodeValue); if (m && (!best || m.index < best.m.index)) best = { g, m }; }
      if (!best) continue;
      const { g, m } = best; used.add(g.t); budget -= 1;
      const after = ch.splitText(m.index); after.splitText(m[1].length);
      const span = document.createElement('span');
      span.className = 'term'; span.tabIndex = 0; span.dataset.term = g.t; span.textContent = after.nodeValue;
      span.setAttribute('aria-describedby', 'tip');
      after.replaceWith(span);
      walk(node); return;
    }
  };
  walk(root);
}
const tipEl = () => document.getElementById('tip');
function showTip(el) {
  const g = GL.find(x => x.t === el.dataset.term); if (!g) return;
  const t = tipEl(); t.innerHTML = `<b>${esc(g.t)}</b><span>${esc(g.d)}</span><span class="tipmeta">${TR("Кубик")} ${g.c} ${TR("· подробнее в словаре")}</span>`;
  t.hidden = false;
  const r = el.getBoundingClientRect(); const w = Math.min(300, window.innerWidth - 24);
  t.style.width = w + 'px';
  const left = Math.max(12, Math.min(r.left + r.width / 2 - w / 2, window.innerWidth - w - 12));
  t.style.left = left + 'px';
  const h = t.offsetHeight; const above = r.top - h - 8;
  t.style.top = (above > 8 ? above : r.bottom + 8) + 'px';
}
const hideTip = () => { const t = tipEl(); if (t) t.hidden = true; };
document.addEventListener('pointerover', e => { if (e.pointerType !== 'mouse') return; const el = e.target.closest('.term'); if (el) showTip(el); });
document.addEventListener('pointerout', e => { if (e.pointerType !== 'mouse') return; if (e.target.closest('.term')) hideTip(); });
document.addEventListener('focusin', e => { const el = e.target.closest('.term'); if (el) showTip(el); else hideTip(); });
document.addEventListener('scroll', hideTip, true);

    <div class="hp-body">${H.tab === 'gloss' ? glossHTML() : libHTML()}</div></div>`;
}

/* --- ИИ-помощник --- */
function ctxNow() {
  const cube = CUR; let face, f;
  if (cube === 'c1') { face = S.face; f = FACES[face - 1]; } else if (cube === 'c2') { face = T.face; f = FACES2[face - 1]; } else { face = CUBES[cube].S.face; f = CUBES[cube].faces[face - 1]; }
  return { cube: TR('Кубик ') + cube.slice(1) + ' «' + CNAMES[cube] + '»', face: face + ' «' + f.title + '»', goal: f.goal, explain: f.explain };
}
function offlineAnswer(q) {
  const hits = GL.filter(g => g.re.test(q) || q.toLowerCase().includes(g.t.toLowerCase())).slice(0, 3);
  const c = ctxNow();
  if (/грань|задани|что делать|подскаж|помоги|не понимаю/i.test(q) || !hits.length) {
    return (hits.length ? hits.map(g => `${g.t}: ${g.d}`).join('\n\n') + '\n\n' : '') + `${TR("Сейчас вы на грани")} ${c.face}${TR(". Цель:")} ${c.goal}${TR("\n\nПодсказка:")} ${c.explain}`;
  }
  return hits.map(g => `${g.t}: ${g.d}`).join('\n\n');
}
async function askAI(q) {
  H.msgs.push({ role: 'user', content: q }); H.busy = true; renderChat();
  let answer = null;
  if (location.protocol === 'file:') H.mode = 'offline';
  if (H.mode !== 'offline') {
    try {
      const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 25000);
      const r = await fetch('/api/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: ctl.signal,
        body: JSON.stringify({ messages: H.msgs.slice(-8), context: ctxNow() }) });
      clearTimeout(tm);
      const j = await r.json().catch(() => ({}));
      if (r.ok && j.answer) { answer = j.answer; H.mode = 'ai'; }
      else if (r.status === 429) answer = TR('Слишком много вопросов подряд. Подождите пару минут.');
      else if (r.status === 404 || r.status === 501 || r.status === 405) H.mode = 'offline';
    } catch (e) { /* сеть недоступна: офлайн-ответ */ }
  }
  if (!answer) answer = offlineAnswer(q) + (H.mode === 'offline' ? '' : TR('\n\n(ИИ сейчас недоступен, ответ из словаря.)'));
  H.msgs.push({ role: 'assistant', content: answer }); H.busy = false; renderChat();
}
function renderChat() {
  const box = $('aibox'); const btn = $('aibtn');
  btn.setAttribute('aria-expanded', H.chat); btn.hidden = H.chat;
  if (!H.chat) { box.hidden = true; return; }
  box.hidden = false;
  const c = ctxNow();
  box.innerHTML = `<div class="ai-head"><div><b>${TR("ИИ-помощник")}</b><div class="muted">${H.mode === 'offline' ? TR('Офлайн-режим: ответы из словаря') : TR('Знает, на какой вы грани')}</div></div><button class="ghost" data-ui="aiclose" aria-label="${TR("Закрыть помощника")}">×</button></div>
    <div class="ai-log" id="ailog" aria-live="polite">
      ${H.msgs.length ? '' : `<div class="msg"><div class="who">${TR("Помощник")}</div><div>${TR("Спросите про термин или задание. Вы сейчас на грани")} ${esc(c.face)}.</div></div>
      <div class="chips">${[TR('Объясни, что делать на этой грани'), TR('Что такое газ?'), TR('Чем мост отличается от биржи?')].map(s => `<button class="chip" data-ui="suggest">${s}</button>`).join('')}</div>`}
      ${H.msgs.map(m => `<div class="msg ${m.role === 'user' ? 'me' : ''}">${m.role === 'user' ? '' : TR('<div class="who">Помощник</div>')}<div style="white-space:pre-wrap">${esc(m.content)}</div></div>`).join('')}
      ${H.busy ? TR('<div class="msg"><div class="who">Помощник</div><div class="muted">Думаю…</div></div>') : ''}</div>
    <form class="ai-form" id="aiform"><input id="aiq" maxlength="600" placeholder="${TR("Ваш вопрос")}" autocomplete="off" aria-label="${TR("Вопрос помощнику")}" ${H.busy ? 'disabled' : ''}><button class="btn" type="submit" ${H.busy ? 'disabled' : ''}>${TR("Спросить")}</button></form>
    <p class="ai-note">${TR("Не пишите сюда seed-фразы, ключи и личные данные. ИИ может ошибаться и не даёт инвестиционных советов.")}</p>`;
  const log = $('ailog'); log.scrollTop = log.scrollHeight;
  if (!H.busy) $('aiq').focus({ preventScroll: true });
}
document.addEventListener('submit', e => {
  if (e.target.id !== 'aiform') return; e.preventDefault();
  const q = $('aiq').value.trim(); if (q && !H.busy) askAI(q.slice(0, 600));
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-ui]');
  if (!b) { if (H.panel && e.target.id === 'helppanel') { H.panel = null; renderHelp(); } const t = e.target.closest('.term'); if (t) showTip(t); else hideTip(); return; }
  const u = b.dataset.ui;
  if (u === 'help') { H.panel = true; H.tab = b.dataset.arg || 'gloss'; renderHelp(); }
  if (u === 'tab') { H.tab = b.dataset.arg; renderHelp(); }
  if (u === 'close') { H.panel = null; renderHelp(); }
  if (u === 'ai') { H.chat = true; renderChat(); }
  if (u === 'aiclose') { H.chat = false; renderChat(); $('aibtn').focus(); }
  if (u === 'suggest') askAI(b.textContent);
});
document.addEventListener('input', e => { if (e.target.dataset.uiInput === 'q') { H.q = e.target.value; const pos = e.target.selectionStart; renderHelp(); const i = $('gq'); i.focus(); i.setSelectionRange(pos, pos); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { hideTip(); if (H.panel) { H.panel = null; renderHelp(); } else if (H.chat) { H.chat = false; renderChat(); } } });


// Телефон: нижние вкладки и плашка текущего шага
let MT = 'task', MSEEN = -1, MKEY = '';
const MQ = window.matchMedia('(max-width: 720px)');
function syncMobile() {
  document.body.dataset.mt = MT;
  const brief = $('brief'); const items = [...brief.querySelectorAll('ul.steps li')];
  const done = items.filter(li => li.classList.contains('ok')).length, next = items.find(li => !li.classList.contains('ok'));
  const eyebrow = brief.querySelector('.eyebrow'), h2 = brief.querySelector('h2');
  const key = CUR + '|' + (eyebrow ? eyebrow.textContent : '');
  if (key !== MKEY) { MKEY = key; MSEEN = done; }
  if (MT === 'task') MSEEN = done;
  $('mstep').innerHTML = `<span class="muted">${esc(eyebrow ? eyebrow.textContent : '')}${h2 ? ' · ' + esc(h2.textContent) : ''}</span>` + (next
    ? `<span><b>${TR('Шаг')} ${done + 1} ${TR('из')} ${items.length}:</b> ${esc(next.textContent.trim())}</span>`
    : `<span><b>${TR('Все шаги выполнены.')}</b> ${TR('Откройте «Задание», чтобы перейти дальше.')}</span>`);
  const tabs = [['task', '☰', TR('Задание')], ['phone', '▯', TR('Телефон')], ['gloss', 'Aa', TR('Словарь')], ['ai', '?', TR('ИИ')]];
  $('mtabs').innerHTML = tabs.map(([k, ic, l]) => `<button type="button" data-mt="${k}" class="${MT === k ? 'on' : ''}" aria-current="${MT === k ? 'page' : 'false'}"><span class="ic" aria-hidden="true">${ic}</span><span>${l}</span>${k === 'task' && MT !== 'task' && done > MSEEN ? '<span class="dot" aria-label="' + TR('Есть новое') + '"></span>' : ''}</button>`).join('');
  fitScreen();
}
function fitScreen() {
  const scr = $('screen'); if (!scr) return;
  if (!MQ.matches || MT !== 'phone') { scr.style.height = ''; return; }
  const tabsH = $('mtabs').offsetHeight || 58;
  const y = scr.getBoundingClientRect().top + window.scrollY;
  scr.style.height = Math.max(420, window.innerHeight - y - tabsH - 12) + 'px';
}
window.addEventListener('resize', fitScreen);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-mt]'); if (!b) return;
  const k = b.dataset.mt;
  if (k === 'gloss') { H.panel = true; H.tab = 'gloss'; renderHelp(); return; }
  if (k === 'ai') { $('aibtn').click(); return; }
  MT = k; syncMobile(); window.scrollTo({ top: 0 });
});

function render() {
  hideTip();
  if (CUBES[CUR]) { U = CUBES[CUR].S; renderN(CUBES[CUR]); CUBES[CUR].S = U; }
  else if (CUR === 'c2') render2(); else { CUR = 'c1'; render1(); }
  header();
  annotate($('brief')); annotate(document.querySelector('.trap .sheet p'));
  syncMobile();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'cube') { CUR = b.dataset.arg; try { localStorage.setItem('cryptocube-cur', CUR); } catch (err) {} render(); window.scrollTo({ top: 0 }); return; }
  if (CUBES[CUR]) { const c = CUBES[CUR]; U = c.S; const fn = GA[act] || c.A[act]; if (fn) { fn(b.dataset.arg, b); c.S = U; render(); } return; }
  if (CUR === 'c2') { if (A2[act]) { A2[act](b.dataset.arg, b); render(); } return; }
  if (act === 'copy') { try { navigator.clipboard.writeText(S.w.addr).then(() => { b.textContent = TR('Скопировано'); }, () => { b.textContent = TR('Выделите адрес вручную'); }); } catch (err) { b.textContent = TR('Выделите адрес вручную'); } return; }
  if (act === 'view') { S.view = b.dataset.arg || null; render(); return; }
  if (A[act]) { A[act](b.dataset.arg, b); render(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (CUBES[CUR] && t.dataset.k) { U = CUBES[CUR].S; U.inp[t.dataset.k] = t.value; try { localStorage.setItem('cryptocube-' + CUBES[CUR].n, JSON.stringify(U)); } catch (err) {} return; }
  if (t.dataset.inp === 'rw') S.f6.words[+t.dataset.i] = t.value;
  if (t.dataset.inp === 'amt') S.f5.amount = t.value;
  save();
});

// resume any pending transactions after reload
S.txs.forEach(t => { if (t.status === 'pending') {
  t.status = 'ok'; S.block += 1; t.block = S.block;
  const b = t.to === S.w.addr ? 'me' : t.to === MASHA ? 'masha' : t.to === PETR ? 'petr' : null;
  if (b) S.bal[b][t.asset] = (S.bal[b][t.asset] || 0) + t.amount;
  onConfirmed(t);
} });
document.addEventListener('click', e => { const b = e.target.closest('[data-lang]'); if (!b) return; try { localStorage.setItem('cryptocube-lang', LANG === 'en' ? 'ru' : 'en'); } catch (err) {} location.reload(); });
translateStatic();
if (S.face === 4 && !S.chat.length) enterFace();
render();
})();
</script>
